<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dicionário Lírico Carneniano</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen py-10 px-4">

  <div class="max-w-4xl mx-auto">
    <!-- Cabeçalho -->
    <header class="text-center mb-8">
      <h1 class="text-4xl font-extrabold tracking-tight text-amber-400 mb-2">Lírico Carneniano</h1>
      <p class="text-stone-400 text-sm">Dicionário & Tradutor Romanizado • Organização Carneniana de Línguas (OCL)</p>
    </header>

    <!-- Controles de Busca -->
    <div class="bg-stone-900 border border-stone-800 rounded-2xl p-4 mb-8 shadow-xl">
      <!-- Alternador de Direção -->
      <div class="flex items-center justify-between gap-3 mb-4 pb-3 border-b border-stone-800">
        <div class="flex items-center gap-2">
          <button 
            id="btn-both" 
            onclick="setSearchMode('ambos')" 
            class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-amber-500 text-stone-950 transition">
            Busca Total
          </button>
          <button 
            id="btn-carnenian" 
            onclick="setSearchMode('carneniano')" 
            class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-stone-800 text-stone-300 hover:bg-stone-700 transition">
            Carneniano → PT
          </button>
          <button 
            id="btn-pt" 
            onclick="setSearchMode('portugues')" 
            class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-stone-800 text-stone-300 hover:bg-stone-700 transition">
            PT → Carneniano
          </button>
        </div>
        <span id="counter" class="text-xs text-stone-500 font-mono">Carregando...</span>
      </div>

      <!-- Barra de Texto -->
      <div class="relative">
        <input 
          type="text" 
          id="search-input"
          placeholder="Pesquisar por termo, tradução, classe ou notas..." 
          class="w-full bg-stone-950 border border-stone-700 rounded-xl px-4 py-3 pl-11 text-base text-stone-100 focus:outline-none focus:border-amber-400 transition"
        >
        <svg class="w-5 h-5 text-stone-500 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>

      <!-- Filtro Dinâmico por Classe -->
      <div id="class-filters" class="flex flex-wrap gap-2 mt-4 text-xs">
        <!-- Renderizado dinamicamente via JS -->
      </div>
    </div>

    <!-- Resultados -->
    <div id="results-container" class="grid gap-4 md:grid-cols-2">
      <div class="col-span-2 text-center py-12 text-stone-500">
        Carregando vocabulário carneniano...
      </div>
    </div>
  </div>

  <script>
    let dicionario = [];
    let searchMode = 'ambos';
    let activeClass = 'todos';

    const input = document.getElementById('search-input');
    const container = document.getElementById('results-container');
    const counter = document.getElementById('counter');
    const filterContainer = document.getElementById('class-filters');

    // Normaliza os dados, suportando tanto FIELD2/DICIONARIO quanto singular/traducao
    function tratarItem(raw) {
      const singular = (raw.singular || raw.DICIONARIO || '').trim();
      const traducao = (raw.traducao || raw.FIELD2 || '').trim();
      const classe = (raw.classe || raw.FIELD3 || raw.CLASE || '').trim();
      const plural = (raw.plural || raw.FIELD4 || '').trim();
      const pronuncia = (raw.pronuncia || raw.FIELD5 || '').trim();
      const uso = (raw.uso || raw.FIELD6 || '').trim();
      const ambiente = (raw.ambiente || raw.FIELD7 || '').trim();

      return { singular, traducao, classe, plural, pronuncia, uso, ambiente };
    }

    async function carregarDicionario() {
      try {
        const resposta = await fetch('dicionario.json');
        if (!resposta.ok) throw new Error('Não foi possível carregar dicionario.json');
        const dadosBrutos = await resposta.json();
        
        // Converte e filtra linhas de cabeçalho acidentais
        dicionario = dadosBrutos
          .map(tratarItem)
          .filter(item => item.singular && 
                          item.singular !== 'PALAVRA/SINGULAR' && 
                          item.singular !== '...' &&
                          item.singular.toLowerCase() !== 'nan');
        
        renderFilters();
        render(dicionario);
      } catch (erro) {
        console.error(erro);
        container.innerHTML = `
          <div class="col-span-2 text-center py-12 text-amber-500 bg-stone-900 border border-amber-900/50 rounded-xl p-6">
            <p class="font-bold mb-2">Erro ao carregar o arquivo dicionario.json</p>
            <p class="text-xs text-stone-400">Verifique se o arquivo <code>dicionario.json</code> está na mesma pasta do <code>index.html</code> no GitHub.</p>
          </div>`;
      }
    }

    function normalizar(texto) {
      return (texto || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function renderFilters() {
      const rawClasses = dicionario.map(item => item.classe).filter(Boolean);
      const uniqueClasses = ['todos', ...new Set(rawClasses)];

      filterContainer.innerHTML = '<span class="text-stone-500 py-1">Classe:</span>';
      
      uniqueClasses.forEach(cls => {
        const btn = document.createElement('button');
        btn.textContent = cls.charAt(0).toUpperCase() + cls.slice(1).toLowerCase();
        btn.className = `px-2.5 py-1 rounded transition ${
          activeClass === cls 
            ? 'bg-amber-950 text-amber-300 border border-amber-800' 
            : 'bg-stone-800/60 hover:bg-stone-800 text-stone-400'
        }`;
        btn.onclick = () => {
          activeClass = cls;
          renderFilters();
          filterData();
        };
        filterContainer.appendChild(btn);
      });
    }

    function render(lista) {
      container.innerHTML = '';
      counter.textContent = `${lista.length} ${lista.length === 1 ? 'termo' : 'termos'}`;

      if (lista.length === 0) {
        container.innerHTML = `
          <div class="col-span-2 text-center py-16 text-stone-600">
            Nenhum termo carneniano encontrado.
          </div>`;
        return;
      }

      lista.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-stone-900 border border-stone-800 hover:border-amber-500/40 rounded-xl p-5 transition flex flex-col justify-between";

        const temPronuncia = item.pronuncia && item.pronuncia.trim() !== "" && item.pronuncia !== "-";
        const tagPronuncia = temPronuncia 
          ? `<span class="text-xs text-amber-400 font-mono bg-amber-950/40 border border-amber-900/40 px-2 py-0.5 rounded">${item.pronuncia}</span>` 
          : `<span class="text-xs text-stone-600 font-mono italic">Pronúncia regular</span>`;

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs uppercase tracking-wider font-semibold text-stone-300 bg-stone-800 px-2 py-0.5 rounded">
                ${item.classe || 'Vocábulo'}
              </span>
              ${tagPronuncia}
            </div>
            
            <h2 class="text-2xl font-bold text-stone-100 mb-1">${item.singular}</h2>
            <p class="text-amber-200/90 font-medium text-base mb-3">${item.traducao}</p>
          </div>
          
          <div class="pt-3 border-t border-stone-800 text-xs text-stone-400 space-y-1">
            <div class="flex justify-between items-center">
              <span><strong class="text-stone-500">Plural:</strong> ${item.plural && item.plural !== '-' ? item.plural : '—'}</span>
              ${item.ambiente && item.ambiente !== '-' && item.ambiente !== 'AMBOS' ? `<span class="text-[10px] text-stone-500 uppercase tracking-widest">${item.ambiente}</span>` : ''}
            </div>
            ${item.uso ? `<p class="text-stone-500 pt-1 italic">${item.uso}</p>` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterData() {
      const query = normalizar(input.value);

      const filtrados = dicionario.filter(item => {
        let matchText = false;
        
        if (searchMode === 'carneniano') {
          matchText = normalizar(item.singular).includes(query) || normalizar(item.plural).includes(query);
        } else if (searchMode === 'portugues') {
          matchText = normalizar(item.traducao).includes(query);
        } else {
          matchText = normalizar(item.singular).includes(query) ||
                      normalizar(item.traducao).includes(query) ||
                      normalizar(item.plural).includes(query) ||
                      normalizar(item.uso).includes(query) ||
                      normalizar(item.pronuncia).includes(query);
        }

        const matchClass = (activeClass === 'todos') || (item.classe && item.classe.trim() === activeClass);
        return matchText && matchClass;
      });

      render(filtrados);
    }

    function setSearchMode(mode) {
      searchMode = mode;
      ['btn-both', 'btn-carnenian', 'btn-pt'].forEach(id => {
        document.getElementById(id).className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-stone-800 text-stone-300 hover:bg-stone-700 transition";
      });
      if (mode === 'ambos') document.getElementById('btn-both').className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-amber-500 text-stone-950 transition";
      if (mode === 'carneniano') document.getElementById('btn-carnenian').className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-amber-500 text-stone-950 transition";
      if (mode === 'portugues') document.getElementById('btn-pt').className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-amber-500 text-stone-950 transition";
      filterData();
    }

    input.addEventListener('input', filterData);

    carregarDicionario();
  </script>
</body>
</html>
