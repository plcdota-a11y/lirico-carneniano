<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tradutor & Dicionário Lírico Carneniano</title>
  
  <link rel="icon" type="image/png" href="favicon.png">
  
  <style>
    @font-face {
      font-family: 'Carneniana';
      src: url('lirico-carneniano.ttf') format('truetype'); 
      font-weight: normal;
      font-style: normal;
    }
    
    .font-carnenian {
      font-family: 'Carneniana', sans-serif;
    }

    .escrita-vertical {
      writing-mode: vertical-lr; 
      text-orientation: upright; 
      max-height: 350px; 
      display: inline-flex;
      flex-wrap: wrap;
      gap: 1.5rem; 
      padding: 10px;
      border-left: 4px solid #f59e0b; 
      background-color: rgba(28, 25, 23, 0.5); 
      border-radius: 8px;
      margin-bottom: 0.5rem;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px; 
    }
    ::-webkit-scrollbar-track {
      background: #1c1917; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #d97706; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #f59e0b; 
    }
    
    textarea {
      scrollbar-width: none;
    }
    textarea::-webkit-scrollbar {
      display: none;
    }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen py-10 px-4">

  <div class="max-w-4xl mx-auto">
    <header class="text-center mb-6">
      <h1 class="text-4xl font-extrabold tracking-tight text-amber-400 mb-2 font-carnenian">Lírico Carneniano</h1>
      <p class="text-stone-400 text-sm">Motor SVO, Flexão Absoluta, Honoríficos & Gênero Biológico • OCL</p>
    </header>

    <div class="flex justify-center mb-8">
      <div class="inline-flex bg-stone-900 border border-stone-800 p-1 rounded-xl shadow-lg">
        <button 
          id="tab-btn-translator" 
          onclick="switchTab('translator')" 
          class="px-5 py-2 text-sm font-semibold rounded-lg bg-amber-500 text-stone-950 transition">
          🔄 Tradutor Sintático
        </button>
        <button 
          id="tab-btn-dictionary" 
          onclick="switchTab('dictionary')" 
          class="px-5 py-2 text-sm font-semibold rounded-lg text-stone-400 hover:text-stone-200 transition">
          📖 Dicionário de Termos
        </button>
      </div>
    </div>

    <!-- ABA 1: TRADUTOR -->
    <div id="section-translator" class="space-y-6">
      <div class="bg-stone-900 border border-stone-800 rounded-2xl shadow-xl overflow-hidden transition-all">
        
        <div class="flex items-center justify-between px-6 py-3 border-b border-stone-800 bg-stone-900/60 flex-wrap gap-2">
          <div class="flex items-center gap-3 font-semibold text-sm">
            <span id="trans-source-label" class="text-amber-400 transition-colors">Português</span>
            <button 
              onclick="invertTranslationDirection()" 
              title="Inverter direção" 
              class="p-1.5 rounded-lg bg-stone-800 hover:bg-stone-700 hover:text-amber-400 text-stone-300 transition-all duration-300 transform hover:scale-110">
              ⇄
            </button>
            <span id="trans-target-label" class="text-stone-300 transition-colors">Lírico Carneniano</span>
          </div>
          <span class="text-xs text-amber-400/90 font-mono bg-amber-950/40 border border-amber-900/40 px-2 py-0.5 rounded shadow-sm">Motor Mestre Ativado</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-stone-800">
          
          <div class="p-4 flex flex-col justify-between bg-stone-950/20">
            <div class="w-full flex-grow">
              <textarea 
                id="translator-input"
                rows="6"
                oninput="autoResize(this)"
                placeholder="Digite sua frase épica (ex: Ó Rei grandioso, a pequena árvore sagrada escondeu...)" 
                class="w-full bg-transparent text-stone-100 placeholder-stone-600 focus:outline-none resize-none text-base font-normal leading-relaxed transition-all"
              ></textarea>
              
              <div id="input-runes-preview" class="hidden"></div>
            </div>

            <div class="flex justify-between items-center pt-3 border-t border-stone-800/60 text-xs text-stone-500 mt-2">
              <span id="input-char-counter">0 caracteres</span>
              <button onclick="clearTranslatorInput()" class="hover:text-amber-400 transition-colors">Limpar</button>
            </div>
          </div>

          <div class="p-4 bg-stone-950/50 flex flex-col justify-between">
            <div 
              id="translator-output"
              class="w-full min-h-[160px] text-amber-200 font-medium text-base leading-relaxed select-all">
              <span class="text-stone-600 font-normal italic flex items-center h-full justify-center opacity-50">A tradução aparecerá aqui...</span>
            </div>
            
            <div class="flex justify-end items-center gap-4 pt-3 border-t border-stone-800/60 text-xs text-stone-500 mt-2">
              <button onclick="playTranslationAudio()" id="speak-btn" class="hover:text-amber-300 text-stone-300 font-medium transition-colors bg-stone-800 px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow-sm">
                🔊 Ouvir
              </button>
              <button onclick="copyTranslation()" id="copy-btn" class="hover:text-amber-400 font-medium transition-colors">Copiar Texto</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ABA 2: DICIONÁRIO COMPLETO -->
    <div id="section-dictionary" class="hidden space-y-6">
      
      <div class="bg-stone-900 border border-stone-800 rounded-2xl p-4 shadow-xl">
        <div class="flex items-center justify-between gap-3 mb-4 pb-3 border-b border-stone-800 flex-wrap">
          <div class="flex items-center gap-2">
            <button id="btn-dict-both" onclick="setDictSearchMode('ambos')" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-amber-500 text-stone-950 transition">
              Busca Total
            </button>
            <button id="btn-dict-carnenian" onclick="setDictSearchMode('carneniano')" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-stone-800 text-stone-300 hover:bg-stone-700 transition">
              Carneniano → PT
            </button>
            <button id="btn-dict-pt" onclick="setDictSearchMode('portugues')" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-stone-800 text-stone-300 hover:bg-stone-700 transition">
              PT → Carneniano
            </button>
          </div>

          <span id="counter" class="text-xs text-stone-500 font-mono w-full sm:w-auto text-right">Carregando...</span>
        </div>

        <div class="relative group">
          <input 
            type="text" 
            id="dict-search-input"
            placeholder="Pesquisar termo exato (ex: Eu), plural, ou conjugação..." 
            class="w-full bg-stone-950 border border-stone-700 rounded-xl px-4 py-3 pl-11 text-base text-stone-100 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500/50 transition-all shadow-inner"
          >
        </div>
      </div>

      <div id="results-container" class="grid gap-4 md:grid-cols-2"></div>
    </div>
  </div>

  <script>
    let dicionario = [];
    let dictSearchMode = 'ambos';
    let translationDirection = 'pt-to-carn';
    let lastTranslatedString = ''; 
    let debounceTimer; 

    // ==========================================
    // SISTEMA CAÇADOR DE VOZES PREMIUM HD
    // ==========================================
    let vozesPremiumPTBR = [];
    function carregarVozes() {
      const vozes = window.speechSynthesis.getVoices();
      vozesPremiumPTBR = vozes.filter(v => v.lang === 'pt-BR' || v.lang === 'pt_BR');
    }
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = carregarVozes;
    }

    const translatorInput = document.getElementById('translator-input');
    const translatorOutput = document.getElementById('translator-output');
    const inputCharCounter = document.getElementById('input-char-counter');
    const transSourceLabel = document.getElementById('trans-source-label');
    const transTargetLabel = document.getElementById('trans-target-label');
    const copyBtn = document.getElementById('copy-btn');

    const dictInput = document.getElementById('dict-search-input');
    const resultsContainer = document.getElementById('results-container');
    const counter = document.getElementById('counter');

    // ==========================================
    // TRADUTOR DE SOTAQUE (MÁGICA FONÉTICA)
    // ==========================================
    function adaptarParaOuvidoPtBR(texto) {
      let lido = texto.toLowerCase();
      lido = lido.replace(/-/g, '');
      lido = lido.replace(/sh/g, 'x');   
      lido = lido.replace(/w/g, 'u');    
      lido = lido.replace(/y/g, 'i');    
      lido = lido.replace(/kh/g, 'rr');  
      lido = lido.replace(/th/g, 't');   
      lido = lido.replace(/ph/g, 'f');   
      lido = lido.replace(/ā/g, 'á').replace(/ē/g, 'ê').replace(/ō/g, 'ô').replace(/ū/g, 'ú');
      lido = lido.replace(/ä/g, 'a').replace(/ë/g, 'e').replace(/ö/g, 'o');
      return lido;
    }

    function playPronunciation(text, fallbackWord) {
      if (!text || text.trim() === '') return;
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel(); 

      let textoParaLer = text.includes('[') ? adaptarParaOuvidoPtBR(fallbackWord) : adaptarParaOuvidoPtBR(text);
      
      const utterance = new SpeechSynthesisUtterance(textoParaLer);
      utterance.lang = 'pt-BR'; 
      utterance.rate = 0.9; 
      utterance.pitch = 1.0; 
      
      if (vozesPremiumPTBR.length === 0) carregarVozes(); 
      let melhorVoz = vozesPremiumPTBR.find(v => v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Premium'));
      if (!melhorVoz && vozesPremiumPTBR.length > 0) melhorVoz = vozesPremiumPTBR[0]; 
      if (melhorVoz) utterance.voice = melhorVoz;
      
      window.speechSynthesis.speak(utterance);
    }

    function playTranslationAudio() {
      if (!lastTranslatedString || lastTranslatedString.includes('aparecerá aqui')) return;
      if (translationDirection === 'carn-to-pt') {
        const ut = new SpeechSynthesisUtterance(lastTranslatedString);
        ut.lang = 'pt-BR';
        if (vozesPremiumPTBR.length > 0) {
           let melhorVoz = vozesPremiumPTBR.find(v => v.name.includes('Google') || v.name.includes('Natural'));
           if (melhorVoz) ut.voice = melhorVoz;
        }
        window.speechSynthesis.speak(ut);
      } else {
        playPronunciation(lastTranslatedString, lastTranslatedString);
      }
    }

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    }

    function switchTab(tab) {
      const secTranslator = document.getElementById('section-translator');
      const secDictionary = document.getElementById('section-dictionary');
      const btnTranslator = document.getElementById('tab-btn-translator');
      const btnDictionary = document.getElementById('tab-btn-dictionary');

      if (tab === 'translator') {
        secTranslator.classList.remove('hidden');
        secDictionary.classList.add('hidden');
        btnTranslator.className = "px-5 py-2 text-sm font-semibold rounded-lg bg-amber-500 text-stone-950 transition shadow-md";
        btnDictionary.className = "px-5 py-2 text-sm font-semibold rounded-lg text-stone-400 hover:text-stone-200 transition";
      } else {
        secTranslator.classList.add('hidden');
        secDictionary.classList.remove('hidden');
        btnDictionary.className = "px-5 py-2 text-sm font-semibold rounded-lg bg-amber-500 text-stone-950 transition shadow-md";
        btnTranslator.className = "px-5 py-2 text-sm font-semibold rounded-lg text-stone-400 hover:text-stone-200 transition";
      }
    }

    function normalizar(texto) {
      return (texto || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    }

    function gerarFemininoPt(palavra) {
      const p = palavra.trim();
      if (p.endsWith('o')) return p.slice(0, -1) + 'a';
      if (p.endsWith('or')) return p + 'a';
      if (p.endsWith('u')) return p + 'a'; 
      return p;
    }

    function gerarPronunciaAutomatica(singular) {
      if (!singular || singular === '-' || singular.includes(' ')) return singular;
      return singular.split('-').map(p => {
        let lowerP = p.toLowerCase();
        let indexTonica = (lowerP.startsWith('i') || lowerP.startsWith('u') || /^(p|s|r|tr|ge|q)[iu]/i.test(lowerP)) ? 1 : 0; 
        
        let silabada = p.replace(/([aeiouāēōūäëöàèìòùáéíóúy])([bcdfghjklmnpqrstvwxz]+)([aeiouāēōūäëöàèìòùáéíóúy])/gi, '$1-$2$3');
        silabada = silabada.replace(/([iu])([aeiouāēōūäëöàèìòùáéíóúy])/gi, '$1-$2');
        let silabas = silabada.split('-');
        let targetIndex = (indexTonica === 0) ? 0 : (silabas.length - 1);
        if(targetIndex >= silabas.length) targetIndex = silabas.length - 1;
        let silabaAlvo = silabas[targetIndex];
        
        if (!/[āēōūäëöàèìòùáéíóú]/.test(silabaAlvo)) {
            silabas[targetIndex] = silabaAlvo.replace(/([aeiou])/i, match => {
                const mapa = {'a':'á', 'e':'é', 'i':'í', 'o':'ó', 'u':'ú', 'A':'Á', 'E':'É', 'I':'Í', 'O':'Ó', 'U':'Ú'};
                return mapa[match] || match;
            });
        }
        return silabas.join('-');
      }).join('-');
    }

    function numeroParaCarneniano(numStr) {
      let n = parseInt(numStr, 10);
      if (isNaN(n)) return numStr;
      if (n === 0) return "Sur";

      const unidades = ["", "Wa", "Snava", "Shomta", "Fotu", "Tiwa", "Soa", "Sashfa", "Shamna", "Psita"];
      const dezenas = ["", "Mēta", "Snavamē", "Shomtamē", "Fotumē", "Tiwamē", "Soamē", "Sashfamē", "Shamnamē", "Psitamē"];
      let partes = [];
      let milhar = Math.floor(n / 1000); n = n % 1000;
      let centena = Math.floor(n / 100); n = n % 100;
      let dezena = Math.floor(n / 10); let unidade = n % 10;

      if (milhar > 0) partes.push(milhar === 1 ? "Sho" : unidades[milhar] + "-Sho");
      if (centena > 0) partes.push(centena === 1 ? "She" : unidades[centena] + "-She");
      if (dezena > 0) partes.push(dezenas[dezena]);
      if (unidade > 0) partes.push(unidades[unidade]);
      return partes.join("-");
    }

    function carnenianoParaNumero(str) {
      const map = {
        "sur": 0, "wa": 1, "snava": 2, "shomta": 3, "fotu": 4, "tiwa": 5, "soa": 6, "sashfa": 7, "shamna": 8, "psita": 9,
        "mēta": 10, "meta": 10, "snavamē": 20, "snavame": 20, "shomtamē": 30, "shomtame": 30,
        "fotumē": 40, "fotume": 40, "tiwamē": 50, "tiwame": 50, "soamē": 60, "soame": 60,
        "sashfamē": 70, "sashfame": 70, "shamnamē": 80, "shamname": 80, "psitamē": 90, "psitame": 90,
        "she": 100, "sho": 1000
      };
      let parts = str.toLowerCase().split('-');
      let total = 0; let temp = 0; let isValid = true;
      for (let i = 0; i < parts.length; i++) {
        let p = parts[i];
        if (!(p in map)) { isValid = false; break; }
        let val = map[p];
        if (val === 100 || val === 1000) {
          if (temp === 0) temp = 1;
          total += temp * val; temp = 0;
        } else temp += val;
      }
      total += temp;
      return isValid ? total.toString() : null;
    }

    // ==========================================
    // MOTOR VERBAL: ISOLAMENTO TEMPORAL ABSOLUTO
    // ==========================================
    function conjugarVerbo(raiz) {
      const r = raiz.trim();
      let passado = r.endsWith('a') ? r.slice(0, -1) + 'em' : r + 'em';
      let presente = r;
      let futuro = r.endsWith('a') ? r.slice(0, -1) + 'ra' : r + 'ra';
      return { passado, presente, futuro };
    }

    function gerarPluralPadrao(singular) {
      const s = singular.trim();
      if (!s || s === '-' || s === '...') return '-';
      // Regra Oficial: Plural ignora "s" do PT e acrescenta "is" à base
      if (s.endsWith('is')) return s;
      return s + 'is';
    }

    function gerarPluralPt(palavra) {
      const p = palavra.trim();
      if (p.endsWith('ao')) return p.slice(0, -2) + 'oes';
      if (p.endsWith('m')) return p.slice(0, -1) + 'ns';
      if (p.endsWith('r') || p.endsWith('z') || p.endsWith('s')) return p + 'es';
      if (p.endsWith('al') || p.endsWith('el') || p.endsWith('ol') || p.endsWith('ul')) return p.slice(0, -1) + 'is';
      if (p.endsWith('il')) return p.slice(0, -1) + 's';
      return p + 's';
    }

    function gerarConjugacoesPt(verboNormalizado) {
      const res = { present: [verboNormalizado], past: [], future: [] };
      const v = verboNormalizado;
      
      // O motor varre e colapsa todas as conjugações de pessoa e número em 3 eixos apenas!
      if (v === 'ser') {
        res.present.push('sou', 'es', 'e', 'somos', 'sois', 'sao', 'seja', 'sejas', 'sejamos', 'sejais', 'sejam', 'sendo');
        res.past.push('fui', 'foste', 'foi', 'fomos', 'fostes', 'foram', 'era', 'eras', 'eramos', 'eram', 'sido');
        res.future.push('serei', 'seras', 'sera', 'seremos', 'sereis', 'serao');
        return res;
      }
      if (v === 'estar') {
        res.present.push('estou', 'estas', 'esta', 'estamos', 'estais', 'estao', 'esteja', 'estejas', 'estejam', 'estejamos', 'estando');
        res.past.push('estive', 'esteve', 'estivemos', 'estiveram', 'estava', 'estavam', 'estado');
        res.future.push('estarei', 'estara', 'estaremos', 'estarao');
        return res;
      }
      if (v === 'ter') {
        res.present.push('tenho', 'tens', 'tem', 'temos', 'tendes', 'tenham', 'tendo');
        res.past.push('tive', 'tiveste', 'teve', 'tivemos', 'tiveram', 'tinha', 'tinhas', 'tinhamos', 'tinham', 'tido');
        res.future.push('terei', 'teras', 'tera', 'teremos', 'terao');
        return res;
      }
      if (v === 'ir') {
        res.present.push('vou', 'vais', 'vai', 'vamos', 'vao', 'va', 'vas', 'vam', 'indo');
        res.past.push('fui', 'foi', 'fomos', 'foram', 'ia', 'iam', 'ido');
        res.future.push('irei', 'ira', 'iremos', 'irao');
        return res;
      }
      if (v === 'ver') {
        res.present.push('vejo', 'ves', 've', 'vemos', 'veem', 'veja', 'vejas', 'vejam', 'vejamos', 'vendo');
        res.past.push('vi', 'viste', 'viu', 'vimos', 'viram', 'via', 'vias', 'viam', 'viamos', 'visto');
        res.future.push('verei', 'vera', 'veremos', 'verao');
        return res;
      }
      if (v === 'fazer') {
        res.present.push('faco', 'fazes', 'faz', 'fazemos', 'fazeis', 'fazem', 'faca', 'facas', 'facamos', 'facam', 'fazendo');
        res.past.push('fiz', 'fizeste', 'fez', 'fizemos', 'fizeram', 'fazia', 'fazias', 'faziamos', 'faziam', 'feito');
        res.future.push('farei', 'faras', 'fara', 'faremos', 'farao');
        return res;
      }
      
      if (v.endsWith('ar')) {
        const stem = v.slice(0, -2);
        res.present.push(stem+'o', stem+'as', stem+'a', stem+'amos', stem+'ais', stem+'am', stem+'e', stem+'es', stem+'emos', stem+'eis', stem+'em', stem+'ando');
        res.past.push(stem+'ei', stem+'aste', stem+'ou', stem+'aram', stem+'ava', stem+'avam', stem+'avamos', stem+'ado', stem+'ados', stem+'ada', stem+'adas');
        res.future.push(stem+'arei', stem+'ara', stem+'aras', stem+'aremos', stem+'arao');
      } else if (v.endsWith('er')) {
        const stem = v.slice(0, -2);
        res.present.push(stem+'o', stem+'es', stem+'e', stem+'emos', stem+'eis', stem+'em', stem+'a', stem+'as', stem+'amos', stem+'ais', stem+'am', stem+'endo');
        res.past.push(stem+'i', stem+'este', stem+'eu', stem+'eram', stem+'ia', stem+'iam', stem+'iamos', stem+'ido', stem+'idos', stem+'ida', stem+'idas');
        res.future.push(stem+'erei', stem+'era', stem+'eras', stem+'eremos', stem+'erao');
      } else if (v.endsWith('ir')) {
        const stem = v.slice(0, -2);
        res.present.push(stem+'o', stem+'es', stem+'e', stem+'imos', stem+'is', stem+'em', stem+'a', stem+'as', stem+'amos', stem+'ais', stem+'am', stem+'indo');
        res.past.push(stem+'i', stem+'iste', stem+'iu', stem+'iram', stem+'ia', stem+'iam', stem+'iamos', stem+'ido', stem+'idos', stem+'ida', stem+'idas');
        res.future.push(stem+'irei', stem+'ira', stem+'iras', stem+'iremos', stem+'irao');
      }

      return res;
    }

    function tratarItem(raw) {
      const singular = String(raw.singular || raw.DICIONARIO || raw['PALAVRA/SINGULAR'] || raw.palavra || raw.termo || '').trim();
      const traducao = String(raw.traducao || raw.FIELD2 || raw._1 || raw['SIGNIFICADO/TRADUÇÃO'] || raw.significado || '').trim();
      const classe = String(raw.classe || raw.FIELD3 || raw._3 || raw.CLASE || raw.CLASSE || '').trim();
      let plural = String(raw.plural || raw.FIELD4 || raw._5 || raw.PLURAL || '').trim();
      let pronuncia = String(raw.pronuncia || raw.FIELD5 || raw._7 || raw.PRONÚNCIA || raw.PRONUNCIA || '').trim();
      const uso = String(raw.uso || raw.FIELD6 || raw._8 || raw.USO || raw['NOTAS / ORIGEM'] || raw.NOTAS || '').trim();
      const ambiente = String(raw.ambiente || raw.FIELD7 || raw._9 || raw.AMBIENTE || '').trim();

      const cNorm = normalizar(classe);
      const isVerbo = cNorm.includes('verbo');
      const isSubstOuAdj = cNorm.includes('subst') || cNorm.includes('adj');
      
      // REGRA SEMÂNTICA: Se for da Natureza (Animais/Plantas), aciona o Gatilho Neutro
      const stringContexto = (uso + " " + traducao + " " + ambiente).toLowerCase();
      const isNatureza = /animal|fauna|ave|pássaro|peixe|lobo|cão|cavalo|monstro|planta|flora|árvore|flor|fruta|mato/i.test(stringContexto);
      const isNeutro = cNorm.includes('neutro') || isNatureza;

      if (isSubstOuAdj && (!plural || plural === '-' || plural.toLowerCase() === 'null')) {
        plural = gerarPluralPadrao(singular);
      }
      
      let isAutoPronuncia = false;
      if (!pronuncia || pronuncia === '-' || pronuncia.toLowerCase() === 'null') {
        pronuncia = gerarPronunciaAutomatica(singular);
        isAutoPronuncia = true;
      }

      const conjugacoes = isVerbo ? conjugarVerbo(singular) : null;
      const traducoesArray = traducao.split(/[\/,;()]/).map(t => normalizar(t)).filter(Boolean);

      return { 
        singular, traducao, classe, plural, pronuncia, isAutoPronuncia, uso, ambiente, isVerbo, conjugacoes, cNorm,
        isNeutro,
        sNorm: normalizar(singular), tNorm: normalizar(traducao), pNorm: normalizar(plural), uNorm: normalizar(uso),
        traducoesArray
      };
    }

    // ==========================================
    // ORDEM SVO & INTERCEPTADORES SINTÁTICOS
    // ==========================================
    function reordenarSintaxeSVO(textoPt) {
      let mod = textoPt;
      
      // Adjetivos dimensionais independentes
      mod = mod.replace(/\b(pequeno|pequena|pequenos|pequenas|inho|inha)\b/gi, "Ink");
      mod = mod.replace(/\b(gigante|gigantes|grande|grandes|ão)\b/gi, "Mö");

      // Modificadores Honoríficos transformados em Sufixos
      mod = mod.replace(/\b(grandioso|grandiosa|grandiosos|grandiosas)\b/gi, "_suf_re_");
      mod = mod.replace(/\b(amado|amada|amados|amadas|querido|querida)\b/gi, "_suf_ma_");
      mod = mod.replace(/\b(desprezível|despreziveis|desprezíveis)\b/gi, "_suf_nu_");
      mod = mod.replace(/\b(mestre|mestres)\b/gi, "_suf_jo_");
      mod = mod.replace(/\b(formal|formalmente)\b/gi, "_suf_k_");
      mod = mod.replace(/\b(fofo|fofa|fofinho|fofinha)\b/gi, "_suf_li_");

      // Ordem SVO Padrão (Coloca adjetivos antes do substantivo)
      mod = mod.replace(/\b(o|a|os|as|um|uma)?\s*([a-zA-ZÀ-ÿ]+)\s+(dele|dela|deles|delas)\b/gi, "$3 $2");
      mod = mod.replace(/\b(o|a|os|as)?\s*(meu|minha|meus|minhas|teu|tua|teus|tuas|seu|sua|nosso|nossa|nossos|nossas)\s+([a-zA-ZÀ-ÿ]+)\b/gi, "$2 $3");
      mod = mod.replace(/([a-zA-ZÀ-ÿ]+)-(me|te|se|nos|vos|lo|la|los|las)\b/gi, "$1 $2");
      mod = mod.replace(/\b(me|te|se|nos|vos)\s+([a-zA-ZÀ-ÿ]+)\b/gi, "$2 $1");
      
      return mod;
    }

    function translateText(text, direction) {
      if (!text || !text.trim()) return '';

      let formattedInput = text;
      
      if (direction === 'pt-to-carn') {
        formattedInput = reordenarSintaxeSVO(formattedInput);

        // Blinda Vocativos e Palavras Homógrafas Críticas
        formattedInput = formattedInput.replace(/(^|[\s,.;:!?()"])(ó|ô|ò|Ó|Ô|Ò)(?=$|[\s,.;:!?()"])/g, "$1_vocativo_");
        formattedInput = formattedInput.replace(/(^|[\s,.;:!?()"])(é|É)(?=$|[\s,.;:!?()"])/g, "$1_verbo_e_");
        formattedInput = formattedInput.replace(/(^|[\s,.;:!?()"])(e|E)(?=$|[\s,.;:!?()"])/g, "$1_conj_e_");
        formattedInput = formattedInput.replace(/(^|[\s,.;:!?()"])(está|estás|estão|Está|Estás|Estão)(?=$|[\s,.;:!?()"])/g, "$1_verbo_$2_");
        formattedInput = formattedInput.replace(/(^|[\s,.;:!?()"])(esta|estas|este|estes|Esta|Estas|Este|Estes)(?=$|[\s,.;:!?()"])/g, "$1_pron_$2_");
        formattedInput = formattedInput.replace(/(^|[\s,.;:!?()"])(nós|Nós)(?=$|[\s,.;:!?()"])/g, "$1_pron_suj_nos_");
        formattedInput = formattedInput.replace(/(^|[\s,.;:!?()"])(nos|Nos)(?=$|[\s,.;:!?()"])/g, "$1_pron_obj_nos_");
        formattedInput = formattedInput.replace(/(^|[\s,.;:!?()"])(vós|Vós)(?=$|[\s,.;:!?()"])/g, "$1_pron_suj_vos_");
        formattedInput = formattedInput.replace(/(^|[\s,.;:!?()"])(vos|Vos)(?=$|[\s,.;:!?()"])/g, "$1_pron_obj_vos_");
        formattedInput = formattedInput.replace(/(^|[\s,.;:!?()"])(dá|Dá)(?=$|[\s,.;:!?()"])/g, "$1_verbo_da_");
        formattedInput = formattedInput.replace(/(^|[\s,.;:!?()"])(da|das|do|dos|Da|Das|Do|Dos)(?=$|[\s,.;:!?()"])/g, "$1_prep_$2_");
      }

      const lines = formattedInput.split('\n');

      const translatedLines = lines.map(line => {
        if (!line.trim()) return '';

        const tokens = line.split(/([,.;:!?()"\s]+)/);
        const activeMap = direction === 'pt-to-carn' ? translationMapPtToCarn : translationMapCarnToPt;

        let result = [];
        let i = 0;

        while (i < tokens.length) {
          const rawToken = tokens[i];
          const isSeparator = /^[,.;:!?()"\s]+$/.test(rawToken);

          if (isSeparator) {
            result.push(rawToken);
            i++;
            continue;
          }

          if (direction === 'pt-to-carn' && /^\d+$/.test(rawToken)) {
            result.push(numeroParaCarneniano(rawToken));
            i++;
            continue;
          }
          if (direction === 'carn-to-pt') {
            let numParsed = carnenianoParaNumero(rawToken);
            if (numParsed !== null) {
              result.push(numParsed);
              i++;
              continue;
            }
          }

          let matched = false;
          for (let span = 5; span >= 1; span -= 2) {
            if (i + span <= tokens.length) {
              const phraseTokens = [];
              for (let k = 0; k < span; k += 2) phraseTokens.push(tokens[i + k]);
              const phraseNorm = normalizar(phraseTokens.join(' '));

              const found = activeMap.find(entry => entry.key === phraseNorm);
              if (found) {
                let targetText = found.target;
                
                let checkToken = phraseTokens[0];
                if (checkToken.startsWith('_')) {
                   let parts = checkToken.split('_');
                   if (parts.length >= 3) checkToken = parts[parts.length - 2];
                }
                
                if (checkToken && checkToken.toUpperCase() !== "VOCATIVO" && checkToken[0] === checkToken[0].toUpperCase() && checkToken[0] !== checkToken[0].toLowerCase()) {
                  targetText = targetText.charAt(0).toUpperCase() + targetText.slice(1);
                } else if (checkToken.toUpperCase() === "VOCATIVO") {
                   targetText = "Ha"; 
                }
                
                result.push(targetText);
                i += span;
                matched = true;
                break;
              }
            }
          }

          if (!matched) {
            let fallback = rawToken;
            if (fallback.includes("_verbo_")) fallback = fallback.replace(/_verbo_(.*?)_/gi, "$1");
            else if (fallback.includes("_pron_suj_")) fallback = fallback.replace(/_pron_suj_(.*?)_/gi, "$1");
            else if (fallback.includes("_pron_obj_")) fallback = fallback.replace(/_pron_obj_(.*?)_/gi, "$1");
            else if (fallback.includes("_pron_")) fallback = fallback.replace(/_pron_(.*?)_/gi, "$1");
            else if (fallback.includes("_prep_")) fallback = fallback.replace(/_prep_(.*?)_/gi, "$1");
            else if (fallback.includes("_conj_")) fallback = fallback.replace(/_conj_(.*?)_/gi, "$1");
            else if (fallback.includes("_vocativo_")) fallback = "Ha";

            result.push(fallback);
            i++;
          }
        }

        // Junta tudo e cola os sufixos honoríficos no substantivo anterior!
        let joinedResult = result.join('');
        if (direction === 'pt-to-carn') {
            joinedResult = joinedResult.replace(/\s+-(rê|ma|nu|jo|k|li)\b/gi, "-$1");
        }
        return joinedResult;
      });

      return translatedLines.join('\n');
    }

    function handleTranslatorInput() {
      const text = translatorInput.value;
      inputCharCounter.textContent = `${text.length} ${text.length === 1 ? 'caractere' : 'caracteres'}`;
      const inputPreview = document.getElementById('input-runes-preview');

      if (!text.trim()) {
        translatorOutput.className = "w-full min-h-[160px] text-amber-200 font-medium text-base leading-relaxed select-all";
        translatorOutput.innerHTML = '<span class="text-stone-600 font-normal italic flex items-center h-full justify-center opacity-50">A tradução aparecerá aqui...</span>';
        lastTranslatedString = '';
        inputPreview.innerHTML = '';
        inputPreview.classList.add('hidden');
        return;
      }

      const translated = translateText(text, translationDirection);
      lastTranslatedString = translated;
      translatorOutput.innerHTML = '';
      inputPreview.innerHTML = '';
      
      if (translationDirection === 'pt-to-carn') {
        inputPreview.classList.add('hidden');
        translatorOutput.className = "w-full min-h-[160px] flex gap-8 overflow-x-auto pb-4"; 
        
        const lines = translated.split('\n');
        lines.forEach(line => {
          if (line.trim() === '') {
             translatorOutput.appendChild(document.createElement('br'));
             return;
          }
          const lineContainer = document.createElement('div');
          lineContainer.className = 'flex flex-col items-center shrink-0 min-w-fit';
          
          const runes = document.createElement('div');
          runes.className = 'font-carnenian text-4xl text-amber-400 mb-2 tracking-wider escrita-vertical text-center break-words';
          runes.textContent = line;
          
          const roman = document.createElement('div');
          roman.className = 'text-sm text-stone-400 italic text-center w-full mt-2 break-words';
          roman.textContent = line;
          
          lineContainer.appendChild(runes);
          lineContainer.appendChild(roman);
          translatorOutput.appendChild(lineContainer);
        });
      } else {
        inputPreview.classList.remove('hidden');
        inputPreview.className = "mt-4 pt-4 border-t border-stone-800/60 flex gap-6 overflow-x-auto pb-2 min-h-[120px]";
        
        const lines = text.split('\n');
        lines.forEach(line => {
          if (line.trim() === '') {
             inputPreview.appendChild(document.createElement('br'));
             return;
          }
          const runes = document.createElement('div');
          runes.className = 'font-carnenian text-3xl text-amber-400/80 tracking-wider escrita-vertical text-center break-words shrink-0';
          runes.textContent = line;
          inputPreview.appendChild(runes);
        });

        translatorOutput.className = "w-full min-h-[160px] text-amber-200 font-medium text-base leading-relaxed select-all";
        translated.split('\n').forEach((tLine, index, arr) => {
            translatorOutput.appendChild(document.createTextNode(tLine));
            if (index < arr.length - 1) translatorOutput.appendChild(document.createElement('br'));
        });
      }
    }

          secaoVerbal = `
            <div class="my-3 p-2.5 bg-stone-950/80 rounded-lg border border-stone-800/80 shadow-inner">
              <span class="text-[10px] uppercase font-bold text-amber-400/80 tracking-wider block mb-1.5">Conjugação por Tempo</span>
              <div class="grid grid-cols-3 gap-1.5 text-center text-xs">
                <div class="bg-stone-900/90 py-1 px-1.5 rounded border border-stone-800">
                  <span class="block text-[10px] text-stone-500 font-medium">Passado (-em)</span>
                  <span class="font-bold text-stone-200">${item.conjugacoes.passado}</span>
                </div>
                <div class="bg-stone-900/90 py-1 px-1.5 rounded border border-amber-900/40">
                  <span class="block text-[10px] text-amber-400/80 font-medium">Presente (Raiz)</span>
                  <span class="font-bold text-amber-300">${item.conjugacoes.presente}</span>
                </div>
                <div class="bg-stone-900/90 py-1 px-1.5 rounded border border-stone-800">
                  <span class="block text-[10px] text-stone-500 font-medium">Futuro (-ra)</span>
                  <span class="font-bold text-stone-200">${item.conjugacoes.futuro}</span>
                </div>
              </div>
            </div>
          `;
        }

        const temPluralValido = item.plural && item.plural !== '-' && item.plural.toLowerCase() !== 'null';

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs uppercase tracking-wider font-semibold ${item.isVerbo ? 'bg-amber-950 text-amber-300 border border-amber-800' : 'bg-stone-800 text-stone-300'} px-2 py-0.5 rounded shadow-sm">
                ${item.classe && item.classe.toLowerCase() !== 'null' ? item.classe : 'Vocábulo'}
              </span>
              ${tagPronuncia}
            </div>
            <div class="mb-3 mt-1">
              <h2 class="font-carnenian text-4xl text-amber-400 tracking-wide">${item.singular}</h2>
              <h3 class="text-xl font-bold text-stone-100 mt-1">${item.singular}</h3>
            </div>
            <p class="text-amber-200/90 font-medium text-base mb-2">${item.traducao && item.traducao.toLowerCase() !== 'null' ? item.traducao : '—'}</p>
            ${secaoVerbal}
          </div>
          <div class="pt-3 border-t border-stone-800 text-xs text-stone-400 space-y-1">
            <div class="flex justify-between items-center">
              <span><strong class="text-stone-500">Plural:</strong> ${item.isVerbo ? '<span class="italic text-stone-500">Imutável</span>' : (temPluralValido ? `<span class="text-stone-200 font-medium">${item.plural}</span>` : '—')}</span>
              ${item.ambiente && item.ambiente !== '-' && item.ambiente !== 'AMBOS' && item.ambiente.toLowerCase() !== 'null' ? `<span class="text-[10px] text-stone-500 uppercase tracking-widest bg-stone-950 px-1 rounded">${item.ambiente}</span>` : ''}
            </div>
            ${item.uso && item.uso !== '-' && item.uso.toLowerCase() !== 'null' ? `<p class="text-stone-500 pt-1 italic">${item.uso}</p>` : ''}
          </div>
        `;
        resultsContainer.appendChild(card);
      });
    }

    function filterDictData() {
      const query = normalizar(dictInput.value);
      const pontuados = [];
      for (let i = 0; i < dicionario.length; i++) {
        const item = dicionario[i];
        let score = 0;
        if (!query) score = 1;
        else {
          if (dictSearchMode === 'carneniano' || dictSearchMode === 'ambos') {
            if (item.sNorm === query) score = Math.max(score, 1000);
            else if (item.pNorm === query) score = Math.max(score, 980);
            else if (item.sNorm.startsWith(query)) score = Math.max(score, 500);
            else if (item.sNorm.includes(query) || item.pNorm.includes(query)) score = Math.max(score, 100);
          }
          if (dictSearchMode === 'portugues' || dictSearchMode === 'ambos') {
            if (item.tNorm === query) score = Math.max(score, 1000);
            else if (item.traducoesArray.includes(query)) score = Math.max(score, 980);
            else if (item.tNorm.startsWith(query)) score = Math.max(score, 450);
            else if (item.tNorm.includes(query)) score = Math.max(score, 80);
          }
        }
        if (score > 0) pontuados.push({ item, score });
      }
      pontuados.sort((a, b) => b.score - a.score);
      renderDictCards(pontuados.map(p => p.item));
    }

    function handleDictSearch() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(filterDictData, 300);
    }

    function setDictSearchMode(mode) {
      dictSearchMode = mode;
      ['btn-dict-both', 'btn-dict-carnenian', 'btn-dict-pt'].forEach(id => {
        document.getElementById(id).className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-stone-800 text-stone-300 hover:bg-stone-700 transition-colors";
      });
      document.getElementById(`btn-dict-${mode === 'ambos' ? 'both' : mode === 'portugues' ? 'pt' : 'carnenian'}`).className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-amber-500 text-stone-950 transition-colors shadow-sm";
      filterDictData();
    }

    async function carregarDicionario() {
      try {
        const resposta = await fetch('dicionario.json');
        if (!resposta.ok) throw new Error('Não foi possível carregar dicionario.json');
        const dadosBrutos = await resposta.json();
        dicionario = dadosBrutos.map(tratarItem).filter(item => item.singular && item.singular !== 'PALAVRA/SINGULAR' && item.singular !== '...' && item.singular.toLowerCase() !== 'null' && item.singular.toLowerCase() !== 'nan');
        buildTranslationMaps();
        filterDictData();
      } catch (erro) {
        resultsContainer.innerHTML = `<div class="col-span-2 text-center py-12 text-amber-500 bg-stone-900 border border-amber-900/50 rounded-xl p-6 shadow-lg"><p class="font-bold mb-2">Erro ao carregar o dicionário</p><p class="text-xs text-stone-400">Verifique se <code>dicionario.json</code> está salvo no repositório.</p></div>`;
      }
    }

    translatorInput.addEventListener('input', handleTranslatorInput);
    dictInput.addEventListener('input', handleDictSearch);
    carregarDicionario();
  </script>
</body>
</html>
