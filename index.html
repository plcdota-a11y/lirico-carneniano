<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tradutor & Dicionário Lírico Carneniano</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    @font-face {
      font-family: 'Carneniana';
      src: url('lirico-carneniano.ttf') format('truetype'); 
      font-weight: normal;
      font-style: normal;
      font-display: swap; 
    }
    
    .font-carnenian {
      font-family: 'Carneniana', sans-serif;
    }

    .escrita-vertical {
      writing-mode: vertical-lr; 
      text-orientation: upright; 
      max-height: 350px; 
      display: inline-flex;
      flex-wrap: wrap;
      gap: 1.5rem; 
      padding: 10px;
      border-left: 4px solid #f59e0b; 
      background-color: rgba(28, 25, 23, 0.5); 
      border-radius: 8px;
      margin-bottom: 0.5rem;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #1c1917; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #d97706; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #f59e0b; }
    
    textarea { scrollbar-width: none; }
    textarea::-webkit-scrollbar { display: none; }

    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; }
    button, input, textarea { -webkit-tap-highlight-color: transparent; }
    button { min-height: 38px; }

    #section-translator > div,
    #section-dictionary > div { backdrop-filter: blur(8px); }

    #translator-output { overflow-wrap: anywhere; word-break: break-word; }
    #input-runes-preview, #translator-output { scrollbar-width: thin; scrollbar-color: #d97706 #1c1917; }
    #results-container > div { min-width: 0; }

    @media (max-width: 767px) {
      body { padding-top: 1.25rem; padding-bottom: 1.25rem; }
      header p { max-width: 30rem; margin-inline: auto; line-height: 1.5; }
      #tab-btn-translator, #tab-btn-dictionary { flex: 1 1 50%; padding-inline: .75rem; font-size: .78rem; }
      .inline-flex { width: 100%; max-width: 30rem; }
      #section-translator .grid { display: block; }
      #section-translator .grid > div { border-left: 0 !important; border-right: 0 !important; }
      #section-translator .grid > div + div { border-top: 1px solid rgba(68,64,60,.75); }
      #translator-input { min-height: 150px; font-size: 1rem; }
      #translator-output { min-height: 180px !important; padding-top: .5rem; }
      .escrita-vertical { max-height: 280px; gap: .85rem; padding: 8px; }
      .font-carnenian.text-4xl { font-size: 1.9rem; }
      #results-container { grid-template-columns: minmax(0, 1fr); }
      #results-container .col-span-2 { grid-column: auto; }
      .grid.grid-cols-3 { grid-template-columns: 1fr; }
    }

    @media (min-width: 768px) {
      #section-translator .grid > div { min-height: 280px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen py-10 px-4">

  <div class="max-w-6xl mx-auto">
    
    <!-- Cabeçalho com Logo -->
    <header class="text-center mb-6 flex flex-col items-center">
      <img src="logollc.png" alt="Lírico Carneniano" class="h-20 w-auto mb-2 drop-shadow-md object-contain" 
           onerror="this.outerHTML='<h1 class=\'text-4xl font-extrabold tracking-tight text-amber-400 mb-2 font-carnenian\'>Lírico Carneniano</h1>'">
      <p class="text-stone-400 text-sm">Motor SVO, Flexão Absoluta, Honoríficos & Gênero Biológico • OCL</p>
    </header>

    <!-- Menu de Abas -->
    <div class="flex justify-center mb-8">
      <div class="inline-flex bg-stone-900 border border-stone-800 p-1 rounded-xl shadow-lg">
        <button id="tab-btn-translator" onclick="switchTab('translator')" class="px-5 py-2 text-sm font-semibold rounded-lg bg-amber-500 text-stone-950 transition shadow-md">
          🔄 Tradutor Sintático
        </button>
        <button id="tab-btn-dictionary" onclick="switchTab('dictionary')" class="px-5 py-2 text-sm font-semibold rounded-lg text-stone-400 hover:text-stone-200 transition">
          📖 Dicionário de Termos
        </button>
      </div>
    </div>

    <!-- ABA 1: TRADUTOR -->
    <div id="section-translator" class="space-y-6">
      <div class="bg-stone-900 border border-stone-800 rounded-2xl shadow-xl overflow-hidden transition-all">
        
        <div class="flex items-center justify-between px-6 py-3 border-b border-stone-800 bg-stone-900/60 flex-wrap gap-2">
          <div class="flex items-center gap-3 font-semibold text-sm">
            <span id="trans-source-label" class="text-amber-400 transition-colors">Português</span>
            <button onclick="invertTranslationDirection()" title="Inverter direção" class="p-1.5 rounded-lg bg-stone-800 hover:bg-stone-700 hover:text-amber-400 text-stone-300 transition-all duration-300 transform hover:scale-110">
              ⇄
            </button>
            <span id="trans-target-label" class="text-stone-300 transition-colors">Lírico Carneniano</span>
          </div>
          <span class="text-xs text-amber-400/90 font-mono bg-amber-950/40 border border-amber-900/40 px-2 py-0.5 rounded shadow-sm">Motor de Flexão Avançado Ativo</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-stone-800">
          
          <div class="p-4 flex flex-col justify-between bg-stone-950/20">
            <div class="w-full flex-grow">
              <textarea id="translator-input" rows="6" oninput="autoResize(this); handleTranslatorInput()" placeholder="Digite sua frase épica (ex: Ó Rei grandioso, a pequena árvore sagrada escondeu...)" class="w-full bg-transparent text-stone-100 placeholder-stone-600 focus:outline-none resize-none text-base font-normal leading-relaxed transition-all"></textarea>
              <div id="input-runes-preview" class="hidden"></div>
            </div>
            <div class="flex justify-between items-center pt-3 border-t border-stone-800/60 text-xs text-stone-500 mt-2">
              <span id="input-char-counter">0 caracteres</span>
              <button onclick="clearTranslatorInput()" class="hover:text-amber-400 transition-colors">Limpar</button>
            </div>
          </div>

          <div class="p-4 bg-stone-950/50 flex flex-col justify-between">
            <div id="translator-output" class="w-full min-h-[160px] text-amber-200 font-medium text-base leading-relaxed select-all">
              <span class="text-stone-600 font-normal italic flex items-center h-full justify-center opacity-50">A tradução aparecerá aqui...</span>
            </div>
            
            <div class="flex justify-end items-center gap-4 pt-3 border-t border-stone-800/60 text-xs text-stone-500 mt-2">
              <button onclick="playTranslationAudio()" id="speak-btn" class="hover:text-amber-300 text-stone-300 font-medium transition-colors bg-stone-800 px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow-sm">
                🔊 Ouvir
              </button>
              <button onclick="copyTranslation()" id="copy-btn" class="hover:text-amber-400 font-medium transition-colors">Copiar Texto</button>
            </div>
          </div>
          
        </div>
      </div>
    </div>

    <!-- ABA 2: DICIONÁRIO COMPLETO -->
    <div id="section-dictionary" class="hidden space-y-6">
      <div class="bg-stone-900 border border-stone-800 rounded-2xl p-4 shadow-xl">
        <div class="flex items-center justify-between gap-3 mb-4 pb-3 border-b border-stone-800 flex-wrap">
          <div class="flex items-center gap-2">
            <button id="btn-dict-both" onclick="setDictSearchMode('ambos')" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-amber-500 text-stone-950 transition shadow-sm">Busca Total</button>
            <button id="btn-dict-carnenian" onclick="setDictSearchMode('carneniano')" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-stone-800 text-stone-300 hover:bg-stone-700 transition">Carneniano → PT</button>
            <button id="btn-dict-pt" onclick="setDictSearchMode('portugues')" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-stone-800 text-stone-300 hover:bg-stone-700 transition">PT → Carneniano</button>
          </div>
          <span id="counter" class="text-xs text-stone-500 font-mono w-full sm:w-auto text-right">Carregando...</span>
        </div>

        <div class="relative group">
          <input type="text" id="dict-search-input" oninput="handleDictSearch()" placeholder="Pesquisar termo exato (ex: Eu), plural, ou conjugação..." class="w-full bg-stone-950 border border-stone-700 rounded-xl px-4 py-3 pl-11 text-base text-stone-100 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500/50 transition-all shadow-inner">
        </div>
      </div>
      <div id="results-container" class="grid gap-4 md:grid-cols-2"></div>
    </div>
    
  </div>

  <script>
    // ==========================================
    // 1. ESTADO GLOBAL E CACHE DE DOM
    // ==========================================
    const State = {
      dicionario: [],
      dictSearchMode: 'ambos',
      translationDirection: 'pt-to-carn',
      lastTranslatedString: '',
      debounceTimer: null,
      vozesPremiumPTBR: [],
      translationMapPtToCarn: [],
      translationMapCarnToPt: []
    };

    const DOM = {
      translatorInput: document.getElementById('translator-input'),
      translatorOutput: document.getElementById('translator-output'),
      inputCharCounter: document.getElementById('input-char-counter'),
      transSourceLabel: document.getElementById('trans-source-label'),
      transTargetLabel: document.getElementById('trans-target-label'),
      copyBtn: document.getElementById('copy-btn'),
      dictInput: document.getElementById('dict-search-input'),
      resultsContainer: document.getElementById('results-container'),
      counter: document.getElementById('counter'),
      inputPreview: document.getElementById('input-runes-preview'),
      btnDictBoth: document.getElementById('btn-dict-both'),
      btnDictCarnenian: document.getElementById('btn-dict-carnenian'),
      btnDictPt: document.getElementById('btn-dict-pt')
    };

    function normalizar(texto) {
      return (texto || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    }

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    }

    function switchTab(tab) {
      const secTranslator = document.getElementById('section-translator');
      const secDictionary = document.getElementById('section-dictionary');
      const classActive = "px-5 py-2 text-sm font-semibold rounded-lg bg-amber-500 text-stone-950 transition shadow-md";
      const classInactive = "px-5 py-2 text-sm font-semibold rounded-lg text-stone-400 hover:text-stone-200 transition";

      if (tab === 'translator') {
        secTranslator.classList.remove('hidden');
        secDictionary.classList.add('hidden');
        document.getElementById('tab-btn-translator').className = classActive;
        document.getElementById('tab-btn-dictionary').className = classInactive;
      } else {
        secTranslator.classList.add('hidden');
        secDictionary.classList.remove('hidden');
        document.getElementById('tab-btn-dictionary').className = classActive;
        document.getElementById('tab-btn-translator').className = classInactive;
      }
    }

    // ==========================================
    // 2. MOTOR DE VOZ
    // ==========================================
    function carregarVozes() {
      if (!window.speechSynthesis) return;
      const vozes = window.speechSynthesis.getVoices();
      State.vozesPremiumPTBR = vozes.filter(v => v.lang === 'pt-BR' || v.lang === 'pt_BR');
    }
    
    if (window.speechSynthesis) {
      carregarVozes();
      window.speechSynthesis.onvoiceschanged = carregarVozes;
    }

    function adaptarParaOuvidoPtBR(texto) {
      let lido = texto.toLowerCase().replace(/-/g, '');
      lido = lido.replace(/sh/g, 'x').replace(/w/g, 'u').replace(/y/g, 'i')
                 .replace(/kh/g, 'rr').replace(/th/g, 't').replace(/ph/g, 'f');
      lido = lido.replace(/ā/g, 'á').replace(/ē/g, 'ê').replace(/ō/g, 'ô').replace(/ū/g, 'ú');
      lido = lido.replace(/ä/g, 'a').replace(/ë/g, 'e').replace(/ö/g, 'o');
      return lido;
    }

    function playPronunciation(text, fallbackWord) {
      if (!text || text.trim() === '' || !window.speechSynthesis) return;
      window.speechSynthesis.cancel(); 
      const textoParaLer = text.includes('[') ? adaptarParaOuvidoPtBR(fallbackWord) : adaptarParaOuvidoPtBR(text);
      const utterance = new SpeechSynthesisUtterance(textoParaLer);
      utterance.lang = 'pt-BR'; 
      utterance.rate = 0.9; 
      utterance.pitch = 1.0; 
      
      if (State.vozesPremiumPTBR.length === 0) carregarVozes(); 
      let melhorVoz = State.vozesPremiumPTBR.find(v => v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Premium'));
      if (!melhorVoz && State.vozesPremiumPTBR.length > 0) melhorVoz = State.vozesPremiumPTBR[0]; 
      
      if (melhorVoz) utterance.voice = melhorVoz;
      window.speechSynthesis.speak(utterance);
    }

    function playTranslationAudio() {
      if (!window.speechSynthesis || !State.lastTranslatedString || State.lastTranslatedString.includes('aparecerá aqui')) return;
      
      if (State.translationDirection === 'carn-to-pt') {
        const ut = new SpeechSynthesisUtterance(State.lastTranslatedString);
        ut.lang = 'pt-BR';
        let melhorVoz = State.vozesPremiumPTBR.find(v => v.name.includes('Google') || v.name.includes('Natural'));
        if (melhorVoz) ut.voice = melhorVoz;
        window.speechSynthesis.speak(ut);
      } else {
        playPronunciation(State.lastTranslatedString, State.lastTranslatedString);
      }
    }

    // ==========================================
    // 3. MOTOR FONÉTICO E MATEMÁTICO
    // ==========================================
    function gerarFemininoPt(palavra) {
      const p = palavra.trim();
      if (p.endsWith('o')) return p.slice(0, -1) + 'a';
      if (p.endsWith('or') || p.endsWith('u')) return p + 'a'; 
      return p;
    }

    function gerarPronunciaAutomatica(singular) {
      if (!singular || singular === '-' || singular.includes(' ')) return singular;
      
      return singular.split('-').map(p => {
        let lowerP = p.toLowerCase();
        let indexTonica = (lowerP.startsWith('i') || lowerP.startsWith('u') || /^(p|s|r|tr|ge|q)[iu]/i.test(lowerP)) ? 1 : 0; 
        
        let silabada = p.replace(/([aeiouāēōūäëöàèìòùáéíóúy])([bcdfghjklmnpqrstvwxz]+)([aeiouāēōūäëöàèìòùáéíóúy])/gi, '$1-$2$3');
        silabada = silabada.replace(/([iu])([aeiouāēōūäëöàèìòùáéíóúy])/gi, '$1-$2');
        let silabas = silabada.split('-');
        
        let targetIndex = (indexTonica === 0) ? 0 : (silabas.length - 1);
        if(targetIndex >= silabas.length) targetIndex = silabas.length - 1;
        
        if (!/[āēōūäëöàèìòùáéíóú]/.test(silabas[targetIndex])) {
            silabas[targetIndex] = silabas[targetIndex].replace(/([aeiou])/i, match => {
                const mapa = {'a':'á', 'e':'é', 'i':'í', 'o':'ó', 'u':'ú', 'A':'Á', 'E':'É', 'I':'Í', 'O':'Ó', 'U':'Ú'};
                return mapa[match] || match;
            });
        }
        return silabas.join('-');
      }).join('-');
    }

    function numeroParaCarneniano(numStr) {
      let n = parseInt(numStr, 10);
      if (isNaN(n)) return numStr;
      if (n === 0) return "Sur";
      
      const unidades = ["", "Wa", "Snava", "Shomta", "Fotu", "Tiwa", "Soa", "Sashfa", "Shamna", "Psita"];
      const dezenas = ["", "Mēta", "Snavamē", "Shomtamē", "Fotumē", "Tiwamē", "Soamē", "Sashfamē", "Shamnamē", "Psitamē"];
      let partes = [];
      
      let milhar = Math.floor(n / 1000); n = n % 1000;
      let centena = Math.floor(n / 100); n = n % 100;
      let dezena = Math.floor(n / 10); let unidade = n % 10;
      
      if (milhar > 0) partes.push(milhar === 1 ? "Sho" : unidades[milhar] + "-Sho");
      if (centena > 0) partes.push(centena === 1 ? "She" : unidades[centena] + "-She");
      if (dezena > 0) partes.push(dezenas[dezena]);
      if (unidade > 0) partes.push(unidades[unidade]);
      
      return partes.join("-");
    }

    function carnenianoParaNumero(str) {
      const map = {
        "sur": 0, "wa": 1, "snava": 2, "shomta": 3, "fotu": 4, "tiwa": 5, "soa": 6, "sashfa": 7, "shamna": 8, "psita": 9,
        "mēta": 10, "meta": 10, "snavamē": 20, "snavame": 20, "shomtamē": 30, "shomtame": 30,
        "fotumē": 40, "fotume": 40, "tiwamē": 50, "tiwame": 50, "soamē": 60, "soame": 60,
        "sashfamē": 70, "sashfame": 70, "shamnamē": 80, "shamname": 80, "psitamē": 90, "psitame": 90,
        "she": 100, "sho": 1000
      };
      
      let parts = str.toLowerCase().split('-');
      let total = 0; let temp = 0; let isValid = true;
      
      for (let i = 0; i < parts.length; i++) {
        let p = parts[i];
        if (!(p in map)) { isValid = false; break; }
        let val = map[p];
        if (val === 100 || val === 1000) {
          if (temp === 0) temp = 1;
          total += temp * val; temp = 0;
        } else temp += val;
      }
      total += temp;
      return isValid ? total.toString() : null;
    }

    // ==========================================
    // 4. MOTOR VERBAL E SINTÁTICO
    // ==========================================
    function conjugarVerbo(raiz) {
      const r = String(raiz || '').trim();
      return { presente: r, passado: r + 'em', futuro: r + 'ra' };
    }

    function gerarPluralPadrao(singular) {
      const s = singular.trim();
      if (!s || s === '-' || s === '...') return '-';
      return s.endsWith('is') ? s : s + 'is';
    }

    function gerarPluralPt(palavra) {
      const p = palavra.trim();
      if (p.endsWith('ao')) return p.slice(0, -2) + 'oes';
      if (p.endsWith('m')) return p.slice(0, -1) + 'ns';
      if (p.endsWith('r') || p.endsWith('z') || p.endsWith('s')) return p + 'es';
      if (p.endsWith('al') || p.endsWith('el') || p.endsWith('ol') || p.endsWith('ul')) return p.slice(0, -1) + 'is';
      if (p.endsWith('il')) return p.slice(0, -1) + 's';
      return p + 's';
    }

    function gerarConjugacoesPt(verboNormalizado) {
      const v = normalizar(verboNormalizado);
      const res = { present: new Set([v]), past: new Set(), future: new Set() };
      const add = (grupo, ...formas) => formas.forEach(f => { if (f) res[grupo].add(normalizar(f)); });

      const especiais = {
        ser: { present: ['sou','es','e','somos','sois','sao','seja','sejas','sejamos','sejais','sejam','sendo'], past: ['fui','foste','foi','fomos','fostes','foram','era','eras','eramos','ereis','eriam','sido'], future: ['serei','seras','sera','seremos','sereis','serao'] },
        estar: { present: ['estou','estas','esta','estamos','estais','estao','esteja','estejas','estejamos','estejam','estando'], past: ['estive','estiveste','esteve','estivemos','estiveram','estava','estavas','estavamos','estavam','estado'], future: ['estarei','estaras','estara','estaremos','estareis','estarao'] },
        ter: { present: ['tenho','tens','tem','temos','tendes','temos','tenham','tendo'], past: ['tive','tiveste','teve','tivemos','tiveram','tinha','tinhas','tinhamos','tinham','tido'], future: ['terei','teras','tera','teremos','tereis','terao'] },
        ir: { present: ['vou','vais','vai','vamos','ides','vao','va','vas','vamos','vam','indo'], past: ['fui','foste','foi','fomos','fostes','foram','ia','ias','iamos','iam','ido'], future: ['irei','iras','ira','iremos','ireis','irao'] },
        ver: { present: ['vejo','ves','ve','vemos','vedes','veem','veja','vejas','vejamos','vejais','vejam','vendo'], past: ['vi','viste','viu','vimos','vistes','viram','via','vias','viamos','viam','visto'], future: ['verei','veras','vera','veremos','vereis','verao'] },
        fazer: { present: ['faco','fazes','faz','fazemos','fazeis','fazem','faca','facas','facamos','facais','facam','fazendo'], past: ['fiz','fizeste','fez','fizemos','fizestes','fizeram','fazia','fazias','faziamos','faziam','feito'], future: ['farei','faras','fara','faremos','fareis','farao','faria','farias','fariamos','fariam'] }
      };

      if (especiais[v]) {
        Object.entries(especiais[v]).forEach(([k, formas]) => add(k, ...formas));
      } else if (v.endsWith('ar')) {
        const s = v.slice(0,-2);
        add('present', s+'o',s+'as',s+'a',s+'amos',s+'ais',s+'am',s+'e',s+'es',s+'emos',s+'eis',s+'em',s+'ando');
        add('past', s+'ei',s+'aste',s+'ou',s+'amos',s+'astes',s+'aram',s+'ava',s+'avas',s+'avamos',s+'avam',s+'ado',s+'ada',s+'ados',s+'adas');
        add('future', s+'arei',s+'aras',s+'ara',s+'aremos',s+'areis',s+'arao',s+'aria',s+'arias',s+'ariamos',s+'ariam');
      } else if (v.endsWith('er')) {
        const s = v.slice(0,-2);
        add('present', s+'o',s+'es',s+'e',s+'emos',s+'eis',s+'em',s+'a',s+'as',s+'amos',s+'ais',s+'am',s+'endo');
        add('past', s+'i',s+'este',s+'eu',s+'emos',s+'estes',s+'eram',s+'ia',s+'ias',s+'iamos',s+'iam',s+'ido',s+'ida',s+'idos',s+'idas');
        add('future', s+'erei',s+'eras',s+'era',s+'eremos',s+'ereis',s+'erao',s+'eria',s+'erias',s+'eriamos',s+'eriam');
      } else if (v.endsWith('ir')) {
        const s = v.slice(0,-2);
        add('present', s+'o',s+'es',s+'e',s+'imos',s+'is',s+'em',s+'a',s+'as',s+'amos',s+'ais',s+'am',s+'indo');
        add('past', s+'i',s+'iste',s+'iu',s+'imos',s+'istes',s+'iram',s+'ia',s+'ias',s+'iamos',s+'iam',s+'ido',s+'ida',s+'idos',s+'idas');
        add('future', s+'irei',s+'iras',s+'ira',s+'iremos',s+'ireis',s+'irao',s+'iria',s+'irias',s+'iriamos',s+'iriam');
      }

      return { present: [...res.present], past: [...res.past], future: [...res.future] };
    }

    // ==========================================
    // 5. TRADUTOR SINTÁTICO E SVO MASTER
    // ==========================================
    function reordenarSintaxeSVO(textoPt) {
      return String(textoPt || '').replace(/\s+/g, ' ').replace(/\s+([,.;:!?])/g, '$1').trim();
    }

    function buildTranslationMaps() {
      const ptList = [];
      const carnList = [];

      const regrasBase = [
        { pt: '_vocativo_', carn: 'Ha', prioridade: 100 }, 
        { pt: 'não', carn: 'An', prioridade: 100 },

        { pt: 'comigo', carn: 'Henani', prioridade: 200 }, { pt: 'contigo', carn: 'Henanti', prioridade: 200 },

        { pt: 'com ela', carn: 'Henanasi', prioridade: 200 }, { pt: 'conosco', carn: 'Henanoni', prioridade: 200 },
        { pt: 'convosco', carn: 'Henauri', prioridade: 200 }, { pt: 'com eles', carn: 'Henanaei', prioridade: 200 },
        { pt: 'com elas', carn: 'Henanaei', prioridade: 200 },
        
        { pt: '_suf_re_', carn: '-rê', prioridade: 100 }, { pt: '_suf_ma_', carn: '-ma', prioridade: 100 },

        { pt: '_prep_do_', carn: 'Nte Pe', prioridade: 100 }, { pt: '_prep_dos_', carn: 'Nte Ne', prioridade: 100 },

        { pt: 'o', carn: 'Pe', prioridade: 6 }, { pt: 'a', carn: 'Te', prioridade: 6 },
        { pt: 'os', carn: 'Ne', prioridade: 6 }, { pt: 'as', carn: 'Ne', prioridade: 6 },
        { pt: 'um', carn: 'Un', prioridade: 6 }, { pt: 'uma', carn: 'Un', prioridade: 6 },
        { pt: 'uns', carn: 'Han', prioridade: 6 }, { pt: 'alguns', carn: 'Han', prioridade: 6 },
        { pt: 'eu', carn: 'Ana', prioridade: 10 }, { pt: 'mim', carn: 'Ani', prioridade: 10 },
        { pt: 'me', carn: 'Ani', prioridade: 10 }, { pt: 'voce', carn: 'Ento', prioridade: 10 },
        { pt: 'tu', carn: 'Ento', prioridade: 10 }, { pt: 'te', carn: 'Enti', prioridade: 10 },
        { pt: 'ti', carn: 'Enti', prioridade: 10 }, { pt: 'ele', carn: 'Nof', prioridade: 10 },
        { pt: 'ela', carn: 'Nas', prioridade: 10 }, { pt: 'eles', carn: 'Nae', prioridade: 10 },
        { pt: 'elas', carn: 'Nae', prioridade: 10 },
        
        { pt: 'em', carn: 'En', prioridade: 7 }, { pt: 'no', carn: 'En', prioridade: 7 },
        { pt: 'na', carn: 'En', prioridade: 7 }, { pt: 'para', carn: 'E', prioridade: 7 },
        
        // Fallbacks adicionais
        { pt: 'rei', carn: 'Uro', prioridade: 30 }, { pt: 'arvore', carn: 'shēn', prioridade: 30 },
        { pt: 'árvore', carn: 'shēn', prioridade: 30 }, { pt: 'espada', carn: 'sifa', prioridade: 30 },
        { pt: 'monstro', carn: 'kruk', prioridade: 30 }, { pt: 'mestre', carn: 'nayato', prioridade: 30 },
        { pt: 'traidor', carn: 'krofa', prioridade: 30 }, { pt: 'palavras', carn: 'sajais', prioridade: 30 },
        { pt: 'sagrada', carn: 'uobana', prioridade: 30 }, { pt: 'sagrado', carn: 'uobana', prioridade: 30 },
        { pt: 'nosso', carn: 'pura', prioridade: 30 }
      ];

      regrasBase.forEach(r => {
        ptList.push({ key: normalizar(r.pt), target: r.carn, len: r.pt.length, prioridade: r.prioridade });
        carnList.push({ key: normalizar(r.carn), target: r.pt, len: r.carn.length, prioridade: r.prioridade });
      });

      State.dicionario.forEach(item => {
        const sNorm = item.sNorm;
        carnList.push({ key: sNorm, target: item.traducoesArray[0] || item.traducao, len: sNorm.length, prioridade: 1 });
        
        if (item.plural && item.plural !== '-') {
          carnList.push({ key: item.pNorm, target: (item.traducoesArray[0] || item.traducao) + 's', len: item.pNorm.length, prioridade: 2 });
        }
        
        if (item.isVerbo && item.conjugacoes) {
          carnList.push({ key: normalizar(item.conjugacoes.passado), target: item.singular + ' (passado)', len: item.conjugacoes.passado.length, prioridade: 3 });
          carnList.push({ key: normalizar(item.conjugacoes.futuro), target: item.singular + ' (futuro)', len: item.conjugacoes.futuro.length, prioridade: 3 });
        }

        item.traducoesArray.forEach(tr => {
          const cleanTr = normalizar(tr.replace(/^(um|uma|o|a|os|as|de|para)\s+/g, ''));
          if (cleanTr) {
            
            // GATILHO DE NATUREZA NEUTRA
            if (item.isNeutro) {
                const ptPlural = gerarPluralPt(cleanTr);
                ptList.push({ key: `o ${cleanTr}`, target: `Ni ${item.singular}`, len: `o ${cleanTr}`.length, prioridade: 20 });
                ptList.push({ key: `a ${cleanTr}`, target: `Ni ${item.singular}`, len: `a ${cleanTr}`.length, prioridade: 20 });
                ptList.push({ key: `os ${ptPlural}`, target: `Ni ${item.plural}`, len: `os ${ptPlural}`.length, prioridade: 20 });
                ptList.push({ key: `as ${ptPlural}`, target: `Ni ${item.plural}`, len: `as ${ptPlural}`.length, prioridade: 20 });
            }

            if (item.isVerbo && item.conjugacoes) {
              const ptConjs = gerarConjugacoesPt(cleanTr);
              ptConjs.present.forEach(w => ptList.push({ key: w, target: item.conjugacoes.presente, len: w.length, prioridade: 3 }));
              ptConjs.past.forEach(w => ptList.push({ key: w, target: item.conjugacoes.passado, len: w.length, prioridade: 3 }));
              ptConjs.future.forEach(w => ptList.push({ key: w, target: item.conjugacoes.futuro, len: w.length, prioridade: 3 }));
              
              let verboPriority = item.isSubstantivo ? 2 : 5;
              ptList.push({ key: cleanTr, target: item.singular, len: cleanTr.length, prioridade: verboPriority });
            } else {
              ptList.push({ key: cleanTr, target: item.singular, len: cleanTr.length, prioridade: 6 }); 
              const ptPlural = gerarPluralPt(cleanTr);
              if (item.plural && item.plural !== '-') {
                ptList.push({ key: ptPlural, target: item.plural, len: ptPlural.length, prioridade: 4 });
              } else {
                ptList.push({ key: ptPlural, target: item.singular, len: ptPlural.length, prioridade: 4 });
              }

              if (item.isAdjetivo || item.isSubstantivo) {
                const ptFem = gerarFemininoPt(cleanTr);
                if (ptFem !== cleanTr) {
                  ptList.push({ key: ptFem, target: item.singular, len: ptFem.length, prioridade: 5 });
                  const ptFemPlural = gerarPluralPt(ptFem);
                  if (item.plural && item.plural !== '-') {
                    ptList.push({ key: ptFemPlural, target: item.plural, len: ptFemPlural.length, prioridade: 4 });
                  } else {
                    ptList.push({ key: ptFemPlural, target: item.singular, len: ptFemPlural.length, prioridade: 4 });
                  }
                }
              }
            }
          }
        });
      });

      ptList.sort((a, b) => b.len - a.len || b.prioridade - a.prioridade);
      carnList.sort((a, b) => b.len - a.len || b.prioridade - a.prioridade);
      State.translationMapPtToCarn = ptList;
      State.translationMapCarnToPt = carnList;
    }

    function tokenizarPalavras(frase) {
      return String(frase || '').match(/[\p{L}\p{M}\-]+|\d+|[^\p{L}\p{M}\d\s]/gu) || [];
    }
    
    function ehPalavra(tok) { return /^[\p{L}\p{M}\-]+$/u.test(tok); }

    function obterCandidatosMapa(tokens, inicio, mapa) {
      const candidatos = [];
      for (let tamanho = Math.min(5, tokens.length - inicio); tamanho >= 1; tamanho--) {
        const trecho = tokens.slice(inicio, inicio + tamanho);
        if (!trecho.every(ehPalavra)) continue;
        const chave = normalizar(trecho.join(' '));
        mapa.forEach(entry => {
          if (entry.key === chave) candidatos.push({ entry, tamanho });
        });
        if (candidatos.length) break;
      }
      return candidatos;
    }

    function processarDimensoes(tokens, direction) {
      const mapa = direction === 'pt-to-carn' ? State.translationMapPtToCarn : State.translationMapCarnToPt;
      const saida = [];
      let i = 0;

      while (i < tokens.length) {
        const t = tokens[i];
        if (/^\d+$/.test(t)) {
          saida.push(direction === 'pt-to-carn' ? numeroParaCarneniano(t) : (carnenianoParaNumero(t) ?? t));
          i++; continue;
        }

        const tamanhoExplicito = {
          pequeno: 'Ink', pequena: 'Ink', pequenos: 'Ink', pequenas: 'Ink',
          miudo: 'Ink', miúda: 'Ink', miúdos: 'Ink', miúdas: 'Ink',
          gigante: 'Mö', gigantes: 'Mö', grande: 'Mö', grandes: 'Mö'
        };
        const nt = normalizar(t);
        
        if (direction === 'pt-to-carn' && tamanhoExplicito[nt]) {
          saida.push(tamanhoExplicito[nt]);
          i++; continue;
        }
        
        if (direction === 'pt-to-carn' && ehPalavra(t)) {
          const tentativas = [];
          const m = nt.match(/^(.+?)(inhas|inhos|inha|inho)$/);
          if (m) tentativas.push({ base: m[1], plural: /s$/.test(m[2]) });
          let aplicado = false;
          for (const tentativa of tentativas) {
            const baseEntry = mapa.find(e => e.key === tentativa.base);
            if (baseEntry) {
              let alvo = baseEntry.target;
              if (tentativa.plural && !/is$/i.test(alvo)) alvo += 'is';
              saida.push('Ink', alvo);
              i++; aplicado = true; break;
            }
          }
          if (aplicado) continue;
        }

        const candidatos = obterCandidatosMapa(tokens, i, mapa);
        if (candidatos.length) {
          saida.push(candidatos[0].entry.target);
          i += candidatos[0].tamanho;
          continue;
        }

        saida.push(t);
        i++;
      }
      return saida;
    }

    function encontrarVerboPt(tokens) {
      const verbos = State.dicionario.filter(i => i.isVerbo);
      const candidatos = [];

      tokens.forEach((token, index) => {
        if (!ehPalavra(token)) return;
        const n = normalizar(token);

        verbos.forEach(item => {
          const formas = item.conjugacoes ? [...item.conjugacoes.presente, ...item.conjugacoes.passado, ...item.conjugacoes.futuro] : [item.traducao];
          if (formas.some(f => normalizar(f) === n)) {
            let tempo = 'presente';
            if (item.conjugacoes && item.conjugacoes.passado.some(f => normalizar(f) === n)) tempo = 'passado';
            if (item.conjugacoes && item.conjugacoes.futuro.some(f => normalizar(f) === n)) tempo = 'futuro';
            
            let prioridade = 100;
            // Desambiguação Absoluta SVO
            if (index > 0 && /^(o|a|os|as|um|uma|uns|umas|meu|minha|teu|nosso|_pron_[a-z]+_)$/i.test(normalizar(tokens[index-1]))) {
                prioridade = 5; 
            }
            candidatos.push({ index, item, tempo, prioridade });
          }
        });

        // Verbos Estáticos Fixos (Fallback)
        const compat = {
          esconder: { raiz: 'hapaia', formas: ['escondeu','escondia','escondido'], tempo: 'passado' },
          atacar: { raiz: 'stota', formas: ['atacara','atacará','atacaras','atacarao','atacará'], tempo: 'futuro' },
          falar: { raiz: 'saja', formas: ['falara','falará','falarei','falaras','falarão','falarao','falaria'], tempo: 'futuro' }
        };

        Object.entries(compat).forEach(([lema, c]) => {
          if (c.formas.some(f => normalizar(f) === n)) {
            candidatos.push({
              index, item: { singular: c.raiz, traducao: lema, isVerbo: true, conjugacoes: conjugarVerbo(c.raiz) },
              tempo: c.tempo, prioridade: 50
            });
          }
        });
      });

      candidatos.sort((a,b) => a.index - b.index || b.prioridade - a.prioridade);
      return candidatos[0] && candidatos[0].prioridade > 10 ? candidatos[0] : null;
    }

    function processarOracao(frase) {
      const tokens = tokenizarPalavras(frase);
      if (!tokens.length) return '';

      let vocativo = '';
      let inicio = 0;
      if (tokens.length >= 2 && /^(ó|ô|ò|_vocativo_)$/i.test(tokens[0])) {
        let fim = 1;
        while (fim < tokens.length && !/^[,;!?]$/.test(tokens[fim])) fim++;
        let vocTokens = tokens.slice(1, fim);
        
        const hon = {
          grandioso: '-rê', grandiosa: '-rê', grandiosos: '-rê', grandiosas: '-rê',
          amado: '-ma', amada: '-ma', queridos: '-ma', querida: '-ma',
          desprezivel: '-nu', desprezível: '-nu', mestre: '-jo', formal: '-k', fofo: '-li', fofa: '-li'
        };
        const sufixos = [];
        vocTokens = vocTokens.filter(t => {
          const s = normalizar(t);
          if (hon[s]) { sufixos.push(hon[s]); return false; }
          return true;
        });
        
        let vocBase = processarDimensoes(vocTokens, 'pt-to-carn').join(' ');
        if (sufixos.length && vocBase) vocBase = vocBase.replace(/\s+$/, '') + sufixos.join('');
        vocativo = 'Ha ' + vocBase;
        inicio = fim < tokens.length ? fim + 1 : fim;
      }

      const corpo = tokens.slice(inicio);
      if (!corpo.length) return vocativo;

      const verbo = encontrarVerboPt(corpo);
      
      if (!verbo) {
        const hon = {
          grandioso: '-rê', grandiosa: '-rê', grandiosos: '-rê', grandiosas: '-rê',
          amado: '-ma', amada: '-ma', queridos: '-ma', querida: '-ma',
          desprezivel: '-nu', desprezível: '-nu', mestre: '-jo', formal: '-k', fofo: '-li', fofa: '-li'
        };
        const sufixos = [];
        const filtrado = corpo.filter(t => {
          const s = normalizar(t);
          if (hon[s]) { sufixos.push(hon[s]); return false; }
          return true;
        });
        let simples = processarDimensoes(filtrado, 'pt-to-carn').join(' ');
        if (sufixos.length && simples) simples = simples.replace(/\s+$/, '') + sufixos.join('');
        return vocativo ? vocativo + (simples ? ', ' + simples : '') : simples;
      }

      let antes = corpo.slice(0, verbo.index).filter(t => normalizar(t) !== 'nao' && normalizar(t) !== 'não');
      let depois = corpo.slice(verbo.index + 1).filter(t => normalizar(t) !== 'nao' && normalizar(t) !== 'não');

      const hon = {
          grandioso: '-rê', grandiosa: '-rê', grandiosos: '-rê', grandiosas: '-rê',
          amado: '-ma', amada: '-ma', queridos: '-ma', querida: '-ma',
          desprezivel: '-nu', desprezível: '-nu', mestre: '-jo', formal: '-k', fofo: '-li', fofa: '-li'
      };
      
      const sufixosAntes = [];
      antes = antes.filter(t => {
          if (hon[normalizar(t)]) { sufixosAntes.push(hon[normalizar(t)]); return false; }
          return true;
      });
      
      const sufixosDepois = [];
      depois = depois.filter(t => {
          if (hon[normalizar(t)]) { sufixosDepois.push(hon[normalizar(t)]); return false; }
          return true;
      });

      let sujeito = processarDimensoes(antes, 'pt-to-carn').join(' ').trim();
      if (sufixosAntes.length && sujeito) sujeito = sujeito.replace(/\s+$/, '') + sufixosAntes.join('');
      
      let verboCarn = (verbo.item && verbo.item.conjugacoes) ? verbo.item.conjugacoes[verbo.tempo] : verbo.item.singular;
      const negativo = corpo.some(t => /^(nao|não)$/i.test(t));
      
      let objeto = processarDimensoes(depois, 'pt-to-carn').join(' ').trim();
      if (sufixosDepois.length && objeto) objeto = objeto.replace(/\s+$/, '') + sufixosDepois.join('');

      const partes = [];
      if (sujeito) partes.push(sujeito);
      if (negativo) partes.push('An');
      partes.push(verboCarn);
      if (objeto) partes.push(objeto);

      const svo = partes.join(' ');
      return vocativo ? vocativo + ', ' + svo : svo;
    }

    function corrigirMorfologiaSaida(texto) {
      let s = String(texto || '');
      s = s.replace(/\s+(-(?:rê|ma|nu|jo|k|li))\b/gi, '$1');
      s = s.replace(/\b([A-Za-zÀ-ÿ]+)(-(?:rê|ma|nu|jo|k|li))([A-Za-zÀ-ÿ]*is)\b/gi, '$1$2$3');
      return s.replace(/\s+([,.;:!?])/g, '$1').replace(/ {2,}/g, ' ').trim();
    }

    function translateText(text, direction) {
      if (!text || !text.trim()) return '';

      if (direction === 'carn-to-pt') {
        return text.split('\n').map(line => {
          if (!line.trim()) return '';
          return processarDimensoes(tokenizarPalavras(line), 'carn-to-pt').join(' ');
        }).join('\n');
      }

      let mod = text;
      // Escudo Gramatical Avançado
      mod = mod.replace(/(^|[\s,.;:!?()"])(ó|ô|ò)(?=$|[\s,.;:!?()"])/gi, "$1_vocativo_");
      mod = mod.replace(/(^|[\s,.;:!?()"])(é)(?=$|[\s,.;:!?()"])/gi, "$1_verbo_e_");
      mod = mod.replace(/(^|[\s,.;:!?()"])(e)(?=$|[\s,.;:!?()"])/gi, "$1_conj_e_");
      mod = mod.replace(/(^|[\s,.;:!?()"])(está|estás|estão)(?=$|[\s,.;:!?()"])/gi, "$1_verbo_$2_");
      mod = mod.replace(/(^|[\s,.;:!?()"])(esta|estas|este|estes)(?=$|[\s,.;:!?()"])/gi, "$1_pron_$2_");
      mod = mod.replace(/(^|[\s,.;:!?()"])(nós)(?=$|[\s,.;:!?()"])/gi, "$1_pron_suj_nos_");
      mod = mod.replace(/(^|[\s,.;:!?()"])(nos)(?=$|[\s,.;:!?()"])/gi, "$1_pron_obj_nos_");
      mod = mod.replace(/(^|[\s,.;:!?()"])(vós)(?=$|[\s,.;:!?()"])/gi, "$1_pron_suj_vos_");
      mod = mod.replace(/(^|[\s,.;:!?()"])(vos)(?=$|[\s,.;:!?()"])/gi, "$1_pron_obj_vos_");
      mod = mod.replace(/(^|[\s,.;:!?()"])(dá)(?=$|[\s,.;:!?()"])/gi, "$1_verbo_da_");
      mod = mod.replace(/(^|[\s,.;:!?()"])(da|das|do|dos)(?=$|[\s,.;:!?()"])/gi, "$1_prep_$2_");
      
      mod = mod.replace(/\s+/g, ' ').trim();

      return mod.split('\n').map(line => {
          if (!line.trim()) return '';
          let result = corrigirMorfologiaSaida(processarOracao(line));
          
          result = result.replace(/_vocativo_/gi, 'Ha');
          result = result.replace(/_[a-z]+_[a-z]+_/gi, '');
          
          let firstWord = result.split(' ')[0];
          if(firstWord) {
             result = result.charAt(0).toUpperCase() + result.slice(1);
          }
          return result;
        }).join('\n');
    }

    function handleTranslatorInput() {
      const text = DOM.translatorInput.value;
      DOM.inputCharCounter.textContent = `${text.length} ${text.length === 1 ? 'caractere' : 'caracteres'}`;

      if (!text.trim()) {
        DOM.translatorOutput.className = "w-full min-h-[160px] text-amber-200 font-medium text-base leading-relaxed select-all";
        DOM.translatorOutput.innerHTML = '<span class="text-stone-600 font-normal italic flex items-center h-full justify-center opacity-50">A tradução aparecerá aqui...</span>';
        State.lastTranslatedString = '';
        DOM.inputPreview.innerHTML = '';
        DOM.inputPreview.classList.add('hidden');
        return;
      }

      const translated = translateText(text, State.translationDirection);
      State.lastTranslatedString = translated;
      DOM.translatorOutput.innerHTML = '';
      DOM.inputPreview.innerHTML = '';
      
      const fragmentOutput = document.createDocumentFragment();
      const fragmentPreview = document.createDocumentFragment();

      if (State.translationDirection === 'pt-to-carn') {
        DOM.inputPreview.classList.add('hidden');
        DOM.translatorOutput.className = "w-full min-h-[160px] flex gap-8 overflow-x-auto pb-4"; 
        
        translated.split('\n').forEach(line => {
          if (line.trim() === '') {
             fragmentOutput.appendChild(document.createElement('br'));
             return;
          }
          const lineContainer = document.createElement('div');
          lineContainer.className = 'flex flex-col items-center shrink-0 min-w-fit';
          const runes = document.createElement('div');
          runes.className = 'font-carnenian text-4xl text-amber-400 mb-2 tracking-wider escrita-vertical text-center break-words';
          runes.textContent = line;
          const roman = document.createElement('div');
          roman.className = 'text-sm text-stone-400 italic text-center w-full mt-2 break-words';
          roman.textContent = line;
          
          lineContainer.appendChild(runes);
          lineContainer.appendChild(roman);
          fragmentOutput.appendChild(lineContainer);
        });
        DOM.translatorOutput.appendChild(fragmentOutput);
      } else {
        DOM.inputPreview.classList.remove('hidden');
        DOM.inputPreview.className = "mt-4 pt-4 border-t border-stone-800/60 flex gap-6 overflow-x-auto pb-2 min-h-[120px]";
        
        text.split('\n').forEach(line => {
          if (line.trim() === '') {
             fragmentPreview.appendChild(document.createElement('br'));
             return;
          }
          const runes = document.createElement('div');
          runes.className = 'font-carnenian text-3xl text-amber-400/80 tracking-wider escrita-vertical text-center break-words shrink-0';
          runes.textContent = line;
          fragmentPreview.appendChild(runes);
        });
        DOM.inputPreview.appendChild(fragmentPreview);

        DOM.translatorOutput.className = "w-full min-h-[160px] text-amber-200 font-medium text-base leading-relaxed select-all";
        translated.split('\n').forEach((tLine, index, arr) => {
            fragmentOutput.appendChild(document.createTextNode(tLine));
            if (index < arr.length - 1) fragmentOutput.appendChild(document.createElement('br'));
        });
        DOM.translatorOutput.appendChild(fragmentOutput);
      }
    }

    function invertTranslationDirection() {
      if (State.translationDirection === 'pt-to-carn') {
        State.translationDirection = 'carn-to-pt';
        DOM.transSourceLabel.textContent = "Lírico Carneniano";
        DOM.transSourceLabel.className = "text-amber-400";
        DOM.transTargetLabel.textContent = "Português";
        DOM.transTargetLabel.className = "text-stone-300";
        DOM.translatorInput.placeholder = "Digite em Lírico Carneniano (ex: Pa Shibra womem en aia)...";
      } else {
        State.translationDirection = 'pt-to-carn';
        DOM.transSourceLabel.textContent = "Português";
        DOM.transSourceLabel.className = "text-amber-400";
        DOM.transTargetLabel.textContent = "Lírico Carneniano";
        DOM.transTargetLabel.className = "text-stone-300";
        DOM.translatorInput.placeholder = "Digite sua frase épica...";
      }
      if (State.lastTranslatedString && !State.lastTranslatedString.includes('aparecerá aqui')) {
          DOM.translatorInput.value = State.lastTranslatedString;
      }
      handleTranslatorInput();
    }

    function clearTranslatorInput() {
      DOM.translatorInput.value = '';
      DOM.translatorInput.style.height = 'auto';
      handleTranslatorInput();
    }

    function copyTranslation() {
      if (!State.lastTranslatedString || State.lastTranslatedString.includes('aparecerá aqui')) return;
      navigator.clipboard.writeText(State.lastTranslatedString).then(() => {
        DOM.copyBtn.textContent = 'Copiado!';
        DOM.copyBtn.className = 'text-amber-400 font-bold';
        setTimeout(() => {
          DOM.copyBtn.textContent = 'Copiar Texto';
          DOM.copyBtn.className = 'hover:text-amber-400 font-medium transition-colors';
        }, 2000);
      });
    }

    // ==========================================
    // 6. RENDERIZAÇÃO DO DICIONÁRIO E FILTROS
    // ==========================================
    function renderDictCards(lista) {
      DOM.resultsContainer.innerHTML = '';
      DOM.counter.textContent = `${lista.length} ${lista.length === 1 ? 'termo' : 'termos'}`;
      
      if (lista.length === 0) {
        DOM.resultsContainer.innerHTML = `<div class="col-span-2 text-center py-16 text-stone-600 font-medium">Nenhum termo encontrado para esta pesquisa.</div>`;
        return;
      }

      const fragment = document.createDocumentFragment();

      lista.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-stone-900 border border-stone-800 hover:border-amber-500/40 rounded-xl p-5 transition-colors flex flex-col justify-between shadow-lg";

        const temPronuncia = item.pronuncia && item.pronuncia.trim() !== "" && item.pronuncia !== "-" && item.pronuncia.toLowerCase() !== "null";
        const pronunciaIcon = item.isAutoPronuncia ? ' <span title="Acentuação gerada automaticamente" class="text-[10px] cursor-help">✨</span>' : '';
        const singularSafe = item.singular.replace(/'/g, "\\'");
        const voz = (temPronuncia ? item.pronuncia : item.singular).replace(/'/g, "\\'");

        const tagPronuncia = temPronuncia 
          ? `<div class="flex items-center"><span class="text-xs text-amber-400 font-mono bg-amber-950/40 border border-amber-900/40 px-2 py-0.5 rounded shadow-sm">${item.pronuncia}${pronunciaIcon}</span><button onclick="playPronunciation('${voz}', '${singularSafe}')" title="Ouvir pronúncia" class="ml-1.5 hover:scale-125 transition-transform text-amber-500">🔊</button></div>` 
          : `<div class="flex items-center"><span class="text-xs text-stone-600 font-mono italic">Pronúncia regular</span><button onclick="playPronunciation('${voz}', '${singularSafe}')" title="Ouvir pronúncia" class="ml-1.5 hover:scale-125 transition-transform text-stone-400 hover:text-amber-500">🔊</button></div>`;

        let secaoVerbal = '';
        if (item.isVerbo && item.conjugacoes) {
          secaoVerbal = `
            <div class="my-3 p-2.5 bg-stone-950/80 rounded-lg border border-stone-800/80 shadow-inner">
              <span class="text-[10px] uppercase font-bold text-amber-400/80 tracking-wider block mb-1.5">Conjugação por Tempo</span>
              <div class="grid grid-cols-3 gap-1.5 text-center text-xs">
                <div class="bg-stone-900/90 py-1 px-1.5 rounded border border-stone-800">
                  <span class="block text-[10px] text-stone-500 font-medium">Passado (-em)</span>
                  <span class="font-bold text-stone-200">${item.conjugacoes.passado}</span>
                </div>
                <div class="bg-stone-900/90 py-1 px-1.5 rounded border border-amber-900/40">
                  <span class="block text-[10px] text-amber-400/80 font-medium">Presente (Raiz)</span>
                  <span class="font-bold text-amber-300">${item.conjugacoes.presente}</span>
                </div>
                <div class="bg-stone-900/90 py-1 px-1.5 rounded border border-stone-800">
                  <span class="block text-[10px] text-stone-500 font-medium">Futuro (-ra)</span>
                  <span class="font-bold text-stone-200">${item.conjugacoes.futuro}</span>
                </div>
              </div>
            </div>
          `;
        }

        const temPluralValido = item.plural && item.plural !== '-' && item.plural.toLowerCase() !== 'null';

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs uppercase tracking-wider font-semibold ${item.isVerbo ? 'bg-amber-950 text-amber-300 border border-amber-800' : 'bg-stone-800 text-stone-300'} px-2 py-0.5 rounded shadow-sm">
                ${item.classe && item.classe.toLowerCase() !== 'null' ? item.classe : 'Vocábulo'}
              </span>
              ${tagPronuncia}
            </div>
            <div class="mb-3 mt-1">
              <h2 class="font-carnenian text-4xl text-amber-400 tracking-wide break-words">${item.singular}</h2>
              <h3 class="text-xl font-bold text-stone-100 mt-1 break-words">${item.traducao && item.traducao.toLowerCase() !== 'null' ? item.traducao : 'Sem tradução cadastrada'}</h3>
            </div>
            ${secaoVerbal}
          </div>
          <div class="pt-3 border-t border-stone-800 text-xs text-stone-400 space-y-1">
            <div class="flex justify-between items-center">
              <span><strong class="text-stone-500">Plural:</strong> ${item.isVerbo ? '<span class="italic text-stone-500">Imutável</span>' : (temPluralValido ? `<span class="text-stone-200 font-medium">${item.plural}</span>` : '—')}</span>
              ${item.ambiente && item.ambiente !== '-' && item.ambiente !== 'AMBOS' && item.ambiente.toLowerCase() !== 'null' ? `<span class="text-[10px] text-stone-500 uppercase tracking-widest bg-stone-950 px-1 rounded">${item.ambiente}</span>` : ''}
            </div>
            ${item.uso && item.uso !== '-' && item.uso.toLowerCase() !== 'null' ? `<p class="text-stone-500 pt-1 italic">${item.uso}</p>` : ''}
          </div>
        `;
        fragment.appendChild(card);
      });
      
      DOM.resultsContainer.appendChild(fragment);
    }

    function filterDictData() {
      const query = normalizar(DOM.dictInput.value);
      const pontuados = [];
      for (let i = 0; i < State.dicionario.length; i++) {
        const item = State.dicionario[i];
        let score = 0;
        if (!query) score = 1;
        else {
          if (State.dictSearchMode === 'carneniano' || State.dictSearchMode === 'ambos') {
            if (item.sNorm === query) score = Math.max(score, 1000);
            else if (item.pNorm === query) score = Math.max(score, 980);
            else if (item.sNorm.startsWith(query)) score = Math.max(score, 500);
            else if (item.sNorm.includes(query) || item.pNorm.includes(query)) score = Math.max(score, 100);
          }
          if (State.dictSearchMode === 'portugues' || State.dictSearchMode === 'ambos') {
            if (item.tNorm === query) score = Math.max(score, 1000);
            else if (item.traducoesArray.includes(query)) score = Math.max(score, 980);
            else if (item.tNorm.startsWith(query)) score = Math.max(score, 450);
            else if (item.tNorm.includes(query)) score = Math.max(score, 80);
          }
        }
        if (score > 0) pontuados.push({ item, score });
      }
      pontuados.sort((a, b) => b.score - a.score);
      renderDictCards(pontuados.map(p => p.item));
    }

    function handleDictSearch() {
      clearTimeout(State.debounceTimer);
      State.debounceTimer = setTimeout(filterDictData, 300);
    }

    function setDictSearchMode(mode) {
      State.dictSearchMode = mode;
      [DOM.btnDictBoth, DOM.btnDictCarnenian, DOM.btnDictPt].forEach(btn => {
        btn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-stone-800 text-stone-300 hover:bg-stone-700 transition-colors";
      });
      const activeClass = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-amber-500 text-stone-950 transition-colors shadow-sm";
      if (mode === 'ambos') DOM.btnDictBoth.className = activeClass;
      if (mode === 'carneniano') DOM.btnDictCarnenian.className = activeClass;
      if (mode === 'portugues') DOM.btnDictPt.className = activeClass;
      
      filterDictData();
    }

    // ==========================================
    // 7. INICIALIZAÇÃO OMNÍVORA DA FONTE JSON
    // ==========================================
    async function carregarDicionario() {
      try {
        let resposta = await fetch('dicionario.json', { cache: 'no-store' });
        if (!resposta.ok) {
          resposta = await fetch('dicionario.json.json', { cache: 'no-store' });
        }
        if (!resposta.ok) throw new Error(`HTTP ${resposta.status}`);

        const dadosBrutos = await resposta.json();
        if (!Array.isArray(dadosBrutos)) {
          throw new Error('O dicionário deve ser um array JSON.');
        }

        State.dicionario = processarJSONOmnivoro(dadosBrutos);

        buildTranslationMaps();
        filterDictData();
        
        if (DOM.translatorInput.value.trim()) handleTranslatorInput();

      } catch (erro) {
        console.error('[Lírico] Falha ao carregar dicionário:', erro);
        DOM.resultsContainer.innerHTML = `
          <div class="col-span-2 text-center py-12 text-amber-500 bg-stone-900 border border-amber-900/50 rounded-xl p-6 shadow-lg">
            <p class="font-bold mb-2">Erro ao carregar o dicionário</p>
            <p class="text-xs text-stone-400">
              Verifique se o seu arquivo JSON foi gerado corretamente ou se a conexão está ativa.
            </p>
          </div>`;
      }
    }

    // Única e Verdadeira Função processarJSONOmnivoro (Reparada)
    function processarJSONOmnivoro(dados) {
      const saida = [];
      const vistos = new Set();

      const adicionar = (item) => {
        if (!item || !item.singular || /^null$/i.test(item.singular)) return;
        if (/^(pessoa|palavra|tipo|honorifico|honíficos|dicionario|palavra\/singular)$/i.test(normalizar(item.singular))) return;
        const chave = `${item.sNorm}|${item.tNorm}|${item.cNorm}`;
        if (!vistos.has(chave)) {
          vistos.add(chave);
          saida.push(item);
        }
      };

      dados.forEach(raw => {
        let singular = '', traducao = '', classe = '', plural = '', pronuncia = '', uso = '', ambiente = '';

        // Formato Array [ "Palavra", "Significado", ... ]
        if (Array.isArray(raw)) {
            const limpos = raw.filter(item => item !== null && item !== undefined && String(item).trim() !== '');
            singular  = limpos[0] || '';
            traducao  = limpos[1] || '';
            classe    = limpos[2] || '';
            plural    = limpos[3] || '';
            pronuncia = limpos[4] || '';
            uso       = limpos[5] || '';
            ambiente  = limpos[6] || '';
            
        // Formato Objeto { "field1": "Palavra", "field2": "Significado" }
        } else if (typeof raw === 'object' && raw !== null) {
            const keys = Object.keys(raw);
            const getVal = (palavrasChave) => {
                for (let p of palavrasChave) {
                    const foundKey = keys.find(k => normalizar(k).includes(normalizar(p)));
                    if (foundKey && raw[foundKey] && String(raw[foundKey]).trim() !== '') {
                        return String(raw[foundKey]).trim();
                    }
                }
                return '';
            };

            // Busca as colunas pelos nomes previstos (sem usar índices numéricos para evitar bugs com "Unnamed: 0")
            singular  = getVal(['singular', 'palavra', 'dicionario', 'field1', 'column1']);
            traducao  = getVal(['traducao', 'significado', 'field2', 'column2']);
            classe    = getVal(['classe', 'clase', 'field3', 'column3']);
            plural    = getVal(['plural', 'field4', 'column4']);
            pronuncia = getVal(['pronuncia', 'field5', 'column5']);
            uso       = getVal(['notas', 'uso', 'origem', 'field6', 'column6']);
            ambiente  = getVal(['ambiente', 'field7', 'column7']);

            // Fallback (Plano B) - Se as colunas estiverem com nomes muito genéricos (Ex: Unnamed: 0, Unnamed: 1)
            if (!singular && !traducao && keys.length >= 2) {
                const vals = Object.values(raw).map(v => v !== null && v !== undefined ? String(v).trim() : '').filter(v => v !== '');
                singular  = vals[0] || ''; 
                traducao  = vals[1] || ''; 
                classe    = vals[2] || '';
                plural    = vals[3] || ''; 
                pronuncia = vals[4] || ''; 
                uso       = vals[5] || '';
                ambiente  = vals[6] || '';
            }
        }

        // Se encontrou a dupla principal, continua a montagem
        if (singular && traducao) {
          const cNorm = normalizar(classe);
          const isVerbo = /\bverbo\b/.test(cNorm);
          const isSubstantivo = cNorm.includes('substant') || cNorm.includes('subst');
          const isAdjetivo = cNorm.includes('adjet') || cNorm.includes('adj');
          const isPronome = cNorm.includes('pronome');
          
          const isNatureza = /\b(animais|plantas|fauna|flora|ave|pássaro|peixe|lobo|cão|cavalo|monstro|flor|fruta|mato|inseto|árvore|arvore)\b/i.test((uso + " " + traducao + " " + ambiente).toLowerCase());
          const isNeutro = cNorm.includes('neutro') || isNatureza;

          // Autocompletar Plural
          if ((isSubstantivo || isAdjetivo) && (!plural || plural === '-' || /^null$/i.test(plural))) {
            plural = gerarPluralPadrao(singular);
          }

          // Autocompletar Pronúncia
          let isAutoPronuncia = false;
          if (!pronuncia || pronuncia === '-' || /^null$/i.test(pronuncia)) {
            pronuncia = gerarPronunciaAutomatica(singular);
            isAutoPronuncia = true;
          }

          // Conjugação Automática
          const conjugacoes = isVerbo ? conjugarVerbo(singular) : null;
          const traducoesArray = traducao.split(/[\/,;()]/).map(t => normalizar(t)).filter(Boolean);

          adicionar({
            singular, traducao, classe, plural, pronuncia, isAutoPronuncia,
            uso, ambiente, genero: '', categoria: '', isVerbo, isSubstantivo, isAdjetivo, // <-- AQUI a variável 'ambiente' foi devidamente repassada!
            isPronome, isNeutro, conjugacoes, cNorm,
            sNorm: normalizar(singular), tNorm: normalizar(traducao), pNorm: normalizar(plural), uNorm: normalizar(uso),
            traducoesArray
          });
        }
      });
      return saida;
    }

    // Inicializa a escuta do Input de tradução
    DOM.translatorInput.addEventListener('input', handleTranslatorInput);
    
    // Inicia o carregamento dos dados
    carregarDicionario();
  </script>
